<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ED1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Prudential · Ôn tập kiến thức sản phẩm</title>
<style>:root{--red:#ED1B2E;--red-d:#B5121F;--red-l:#FDE8EA;--ink:#1D1D1F;--ink2:#3A3B40;--gray:#6E6E73;--line:#E5E5EA;--bg:#F5F5F7;--ok:#1E9E5A;--ok-l:#E4F5EC;--no:#C8102E;--no-l:#FDE8EA;--sh1:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);--sh2:0 4px 10px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.12);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--g:#ED1B2E;--gd:#B5121F;--gl:#FDE8EA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;transition:background .4s}
@supports not (overflow:clip){body{overflow-x:hidden}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid #0A66C2;outline-offset:3px}
.bar{position:sticky;top:0;z-index:50;padding:calc(10px + var(--st)) 16px 10px;background:rgba(245,245,247,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
body.redmode .bar{display:none}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh1);flex:none}
.ib svg{width:18px;height:18px}
.bar-t{flex:1;min-width:0;text-align:center}
.bar-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t small{display:block;font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;justify-content:center;margin-top:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D1D1D6;transition:all .3s}
.dots i.on{width:18px;background:var(--red)}.dots i.done{background:#F4A3AB}
.spacer{width:40px;flex:none}
main{max-width:620px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) calc(170px + var(--sb)) max(16px,env(safe-area-inset-right))}
.view{animation:vin .45s cubic-bezier(.2,.8,.2,1)}
.view.back{animation:vback .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vback{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h2{font-size:clamp(24px,6.2vw,32px);line-height:1.15;letter-spacing:-.02em;margin:4px 0 6px}
.lead{color:var(--gray);margin:0 0 18px;font-size:16px}
.q-head{margin:6px 2px 18px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16.5px;transition:transform .15s,opacity .2s,background .25s}
.btn:active{transform:scale(.96)}
.btn svg{width:19px;height:19px;flex:none}
.b-pri{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(237,27,46,.28)}
.b-ghost{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.full{width:100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(14px + var(--sb));background:linear-gradient(rgba(245,245,247,0),rgba(245,245,247,.96) 30%);animation:dock .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.dock-in{pointer-events:auto;max-width:620px;margin:0 auto;display:grid;gap:10px}
.dock-in.two{grid-template-columns:1fr 1fr}
@keyframes dock{from{transform:translateY(100%)}to{transform:none}}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .55s ease-out;background:rgba(255,255,255,.45);pointer-events:none}
.b-ghost .ripple,.opt .ripple,.mode-w .ripple,.ans .ripple,.ib .ripple,.prod .ripple{background:rgba(0,0,0,.08)}
@keyframes rip{to{transform:scale(4);opacity:0}}
body.redmode{background:#D7101F}
.home{position:relative;min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-top:calc(14px + var(--st));color:#fff}
.home-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 85% -10%,#FF4A57 0%,rgba(255,74,87,0) 60%),radial-gradient(90% 60% at -10% 110%,#9E0A16 0%,rgba(158,10,22,0) 60%),linear-gradient(165deg,#ED1B2E 0%,#C8102E 100%);overflow:hidden}
.home-bg i{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.home-bg i:nth-child(1){width:520px;height:520px;right:-260px;top:-200px}
.home-bg i:nth-child(2){width:360px;height:360px;right:-180px;top:-120px;background:rgba(255,255,255,.04)}
.home-bg i:nth-child(3){width:300px;height:300px;left:-170px;bottom:-110px}
.lang-row{display:flex;justify-content:flex-end;animation:vin .5s both}
.lang{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px;gap:2px}
.lang button{position:relative;overflow:hidden;min-width:48px;min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#fff;transition:background .25s,color .25s}
.lang button.on{background:#fff;color:var(--red);box-shadow:0 4px 12px rgba(90,0,8,.25)}
.logo-wrap{display:flex;justify-content:center;margin-top:6px}
.logo{width:clamp(140px,40vw,180px);aspect-ratio:1;border-radius:42px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.35),0 0 0 14px rgba(255,255,255,.12),0 28px 60px rgba(90,0,8,.45);animation:logoIn .9s cubic-bezier(.2,1.3,.4,1) both,floaty 5s ease-in-out 1s infinite}
.logo svg{width:78%;height:78%}
@keyframes logoIn{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{50%{transform:translateY(-6px)}}
.gtitle{text-align:center;margin:24px 0 18px;animation:vin .6s .15s both}
.gtitle h1{font-size:clamp(32px,9vw,46px);line-height:1.06;letter-spacing:-.025em;margin:4px 0 6px;font-weight:800;text-shadow:0 4px 18px rgba(90,0,8,.25)}
.gtitle p{margin:0;font-size:15px;font-weight:600;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:400px;width:100%;margin:0 auto;padding:12px 6px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);animation:vin .6s .25s both}
.stats div{text-align:center;line-height:1.15}
.stats div:not(:last-child){border-right:1px solid rgba(255,255,255,.28)}
.stats b{display:block;font-size:26px;font-weight:800}
.stats span{font-size:12px;font-weight:700;opacity:.9}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;animation:vin .6s .35s both}
.mode-w{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border-radius:26px;padding:16px 14px;min-height:168px;transition:transform .18s}
.mode-w:active{transform:scale(.97)}
.mode-w .mi{width:clamp(52px,14vw,64px);height:clamp(52px,14vw,64px);border-radius:18px;display:grid;place-items:center}
.mode-w b{font-size:clamp(22px,6.2vw,30px);line-height:1.12;letter-spacing:-.02em;margin-top:auto;font-weight:800}
.mode-w small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:4px;letter-spacing:0;line-height:1.3}
.mode-w .ar2{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.m1{background:#fff;color:var(--ink);box-shadow:0 14px 30px rgba(90,0,8,.25)}
.m1 .mi{background:var(--red-l);color:var(--red)}.m1 .ar2{background:var(--red);color:#fff}
.m2{background:#FFE3E6;color:#7A0B15;box-shadow:0 14px 30px rgba(90,0,8,.25)}
.m2 .mi{background:#fff;color:var(--red)}.m2 .ar2{background:#B5121F;color:#fff}
/* product picker */
.sec{display:flex;align-items:center;gap:10px;margin:18px 4px 10px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.sec:first-of-type{margin-top:4px}
.sec i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--sc);color:#fff}
.sec i svg{width:15px;height:15px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.prod{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:24px;padding:14px 14px 14px 14px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .2s;animation:fup .45s both}
.prod:active{transform:scale(.975)}
@media (hover:hover) and (pointer:fine){.prod:hover{box-shadow:var(--sh2);transform:translateY(-2px)}}
.prod .pi{width:62px;height:62px;border-radius:18px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--pc),var(--pd));box-shadow:0 8px 18px rgba(0,0,0,.14)}
.prod .pi svg{width:30px;height:30px}
.prod .ot{flex:1;min-width:0}
.prod .ot small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pc)}
.prod .ot b{display:block;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.prod .ot span{display:block;font-size:13px;color:var(--gray);margin-top:2px}
.prod .mbar{max-width:none}
.prod .mbar i{background:var(--pc)}
.prod .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prod .chev{color:#C7C7CC}
.prods{display:grid;gap:10px}
.soon{display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px 16px;border:1.5px dashed #D1D1D6;color:var(--gray);font-size:13.5px;font-weight:600}
.soon svg{flex:none}
.opts{display:grid;gap:12px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;text-align:left;background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .2s;animation:fup .45s both}
.opt:active{transform:scale(.975)}
@media (hover:hover) and (pointer:fine){.opt:hover,.mode-w:hover{box-shadow:var(--sh2);transform:translateY(-2px)}.ans:not(:disabled):hover{transform:translateX(3px)}}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:17px;line-height:1.3}
.opt .ot span{display:block;font-size:13.5px;color:var(--gray);line-height:1.4;margin-top:2px}
.opt .chev{color:#C7C7CC;flex:none}
.opt.sel{box-shadow:inset 0 0 0 2.5px var(--g),var(--sh1)}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.big small{font-size:16px;font-weight:700;color:var(--gray);margin-left:4px;letter-spacing:0}
.grp-opt{padding:0;align-items:stretch;gap:14px}
.grp-opt .gside{width:84px;flex:none;background:linear-gradient(160deg,var(--g),var(--gd));color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:16px 0}
.grp-opt .gside i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;opacity:.9}
.grp-opt .ot{padding:14px 0;align-self:center}
.grp-opt .side-r{display:flex;align-items:center;gap:6px;padding-right:14px}
.grp-opt.rev{--g:#C8102E;--gd:#8E0B20;--gl:#FDE8EA}
.mbar{height:6px;border-radius:6px;background:#EFEFF2;overflow:hidden;margin-top:8px;max-width:220px}
.mbar i{display:block;height:100%;background:var(--g);border-radius:6px;transition:width .6s}
.cnt-due{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--gl);color:var(--gd);white-space:nowrap}
.linkbtn{font-size:14px;font-weight:700;color:var(--gray);padding:10px;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center}
.ready{text-align:center;padding-top:6px}
.ready .rbadge{width:96px;height:96px;margin:6px auto 14px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--g),var(--gd));box-shadow:0 18px 36px rgba(0,0,0,.18);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F1F1F4;color:var(--ink2)}
.summary-pill{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.how{display:grid;gap:10px;margin-top:18px;text-align:left}
.how div{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh1);animation:fup .45s both}
.how div:nth-child(2){animation-delay:.08s}.how div:nth-child(3){animation-delay:.16s}
.how i{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--gl);color:var(--g);font-style:normal}
.how span{font-size:15px;line-height:1.4}
.how b{display:block;font-size:15.5px}
.prog{height:5px;border-radius:5px;background:#E3E3E8;overflow:hidden;margin:2px 0 14px}
.prog i{display:block;height:100%;background:var(--red);transition:width .4s}
.flipwrap{perspective:1600px}
.flipper{transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-origin:center}
.fcard{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 20px;color:#fff;background:linear-gradient(160deg,var(--g) 0%,var(--gd) 100%);box-shadow:0 22px 48px rgba(0,0,0,.18);-webkit-user-select:none;user-select:none}
.fcard>*{position:relative;z-index:1}
.fcard .deco1,.fcard .deco2,.fcard .grid{position:absolute;z-index:0;pointer-events:none}
.fcard .deco1{right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(255,255,255,.16)}
.fcard .deco2{left:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.1)}
.fcard .grid{right:26px;top:150px;width:70px;height:46px;background-image:radial-gradient(rgba(255,255,255,.35) 1.4px,transparent 1.6px);background-size:12px 12px;opacity:.7}
.fc-brand{text-align:center;background:#fff;color:var(--g);font-size:11px;font-weight:800;letter-spacing:.14em;padding:8px 10px;border-radius:999px}
.fc-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.fc-grp{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap;row-gap:4px}
.fc-grp b{background:#fff;color:var(--g);font-size:10.5px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.fc-mid .lab{font-size:11.5px;font-weight:800;letter-spacing:.2em;opacity:.9;margin-top:8px}
.fc-mid .num{font-size:60px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.fc-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:0 0 0 10px rgba(255,255,255,.07);flex:none}
.fc-ic>span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:2.5px solid rgba(255,255,255,.85)}
.fc-quote{margin-top:14px;border-radius:22px;padding:16px 16px 16px 24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);position:relative}
.fc-quote:before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:4px;border-radius:3px;background:#fff}
.fc-quote p{margin:0;font-size:clamp(18px,4.8vw,22px);font-weight:800;line-height:1.35}
.fcard.flash{min-height:min(62vh,520px);display:flex;flex-direction:column}
.fcard.flash .fc-quote{flex:1;display:flex;align-items:center;padding:22px 18px 22px 26px}
.fcard.flash .fc-quote p{font-size:clamp(20px,5.6vw,27px);line-height:1.32}
.ask-hint{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-style:italic;font-weight:600}
.ask-hint i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(255,255,255,.22)}
.answers{display:grid;gap:9px;margin-top:14px}
.ans{position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;padding:12px 14px 12px 12px;font-size:15px;line-height:1.42;font-weight:600;transition:transform .18s,box-shadow .2s,background .2s;animation:fup .4s both}
.ans:nth-child(2){animation-delay:.05s}.ans:nth-child(3){animation-delay:.1s}.ans:nth-child(4){animation-delay:.15s}
.ans:active{transform:scale(.98)}
.ans .L{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--gl);color:var(--g);transition:all .2s}
.ans .tx{flex:1;min-width:0;padding-top:4px}
.ans.on{background:#fff;box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(255,255,255,.45),0 10px 22px rgba(0,0,0,.18)}
.ans.on .L{background:var(--g);color:#fff;transform:scale(1.08)}
.answers.has .ans:not(.on){opacity:.75}
.fc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.18em}
.fc-foot span:last-child{letter-spacing:0;font-weight:600;opacity:.9;display:flex;gap:6px;align-items:center;text-align:right}
.bcard{border-radius:30px;padding:10px;background:linear-gradient(160deg,var(--g),var(--gd));box-shadow:0 22px 48px rgba(0,0,0,.16)}
.bcard-in{background:#fff;color:var(--ink);border-radius:22px;padding:16px 16px 14px}
.bc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc-tag{background:var(--g);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px}
.res{display:flex;align-items:center;gap:12px;margin:12px 0 10px;padding:12px 14px;border-radius:18px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.res i{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-style:normal}
.res i svg{width:22px;height:22px}
.res b{display:block;font-size:17px;line-height:1.2}
.res span{font-size:13.5px;font-weight:600;opacity:.85}
.res.ok{background:var(--ok-l);color:#14713F}.res.ok i{background:var(--ok)}
.res.no{background:var(--no-l);color:var(--no)}.res.no i{background:var(--no)}
.bc-q{margin:4px 0 10px;color:var(--ink2);font-size:15px;font-weight:600;line-height:1.45}
.alist{display:grid;gap:7px}
.al{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:9px 11px;font-size:14.5px;line-height:1.42;background:#F7F7F9;color:var(--gray)}
.al .L{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;background:#E8E8ED;color:var(--gray)}
.al .tx{flex:1;padding-top:2px}
.al .mk{flex:none;width:22px;height:22px;margin-top:2px}
.al.right{background:var(--ok-l);color:#0F5A32;font-weight:700;box-shadow:inset 0 0 0 1.5px #BFE6CF}
.al.right .L{background:var(--ok);color:#fff}
.al.wrong{background:var(--no-l);color:#8E0B20;box-shadow:inset 0 0 0 1.5px #F6C3CA;text-decoration:line-through;text-decoration-color:rgba(200,16,46,.45)}
.al.wrong .L{background:var(--no);color:#fff}
.ansbox{margin-top:12px;border-radius:18px;padding:14px;background:var(--ok-l);box-shadow:inset 0 0 0 1.5px #BFE6CF;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
