const PRODUCTS = [{"id": "pytvk", "cat": "main", "name": "PRUYên Tâm Vui Khỏe", "type": {"vi": "Bảo hiểm tử kỳ", "en": "Term Life"}, "ic": "shield", "groups": [["elig", [1, 8, 9, 10, 11, 12, 13, 41]], ["benefit", [2, 3, 32, 33, 34, 4, 5, 6, 7, 26]], ["interim", [18, 19, 20, 21, 31, 35, 36]], ["owner", [14, 15, 16, 17, 27, 28, 29, 30, 42, 43, 44, 45, 46]], ["ops", [22, 23, 24, 25, 37, 38, 39, 40, 47, 48, 49, 50]]], "qs": [{"id": 1, "a": 3, "vi": {"q": "Đâu là các ưu điểm của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe?", "o": ["Chi phí hợp lý - Phí bảo hiểm hợp lý giúp việc lập kế hoạch tài chính trở nên dễ dàng hơn.", "Đơn giản - Quyền lợi rõ ràng, dễ hiểu, với bảo vệ được đảm bảo và tập trung vào các nhu cầu cốt lõi.", "Linh hoạt - Dễ dàng kết hợp thêm các quyền lợi bảo vệ bổ sung (Sản phẩm Bán cùng) để xây dựng sự an tâm toàn diện.", "Cả A, B và C"], "e": "Brochure mô tả 3 điểm nổi bật: mức phí phù hợp, giải pháp đơn giản dễ hiểu và linh hoạt kết hợp Bảo Hiểm Bán Cùng. T&C không dùng nguyên văn nhóm thông điệp tiếp thị này; tham chiếu thêm định nghĩa Bảo Hiểm Bán Cùng tại phần Định nghĩa, khoản 2.", "r": "Brochure sản phẩm"}, "en": {"q": "What are the advantages of the PRUYên Tâm Vui Khỏe Term Life product?", "o": ["Affordable – reasonable premiums make financial planning easier.", "Simple – clear, easy-to-understand benefits with guaranteed protection focused on core needs.", "Flexible – easily add extra protection benefits (riders) for comprehensive peace of mind.", "All of A, B and C"], "e": "The brochure highlights 3 key features: affordable premiums, a simple and easy-to-understand solution, and the flexibility to add riders. The T&C does not use this marketing message verbatim; see also the definition of Rider in Definitions, item 2.", "r": "Product brochure"}, "m": 1}, {"id": 2, "a": 2, "vi": {"q": "Trong thời hạn có hiệu lực của Hợp Đồng Bảo Hiểm, nếu Người Được Bảo Hiểm (từ 4 tuổi trở lên) tử vong, không thuộc Điều khoản loại trừ, quyền lợi được chi trả như sau, sau khi trừ đi các Khoản Nợ (nếu có)", "o": ["50% STBH", "70% STBH", "100% STBH", "100% STBH + Lãi chia cuối HĐ"], "e": "Với Người Được Bảo Hiểm từ 4 tuổi trở lên, quyền lợi tử vong là 100% Số Tiền Bảo Hiểm, sau khi trừ các Khoản Nợ, nếu có.", "r": "Điều 1"}, "en": {"q": "While the Policy is in force, if the Life Assured (aged 4 or above) dies and the event is not excluded, what benefit is payable after deducting any Indebtedness?", "o": ["50% of Sum Assured", "70% of Sum Assured", "100% of Sum Assured", "100% of Sum Assured + terminal bonus"], "e": "For a Life Assured aged 4 or above, the death benefit is 100% of the Sum Assured, less any Indebtedness.", "r": "Article 1"}}, {"id": 3, "a": 2, "vi": {"q": "Nếu Người Được Bảo Hiểm là trẻ em từ 2 tuổi đến dưới 3 tuổi tử vong, không thuộc điều khoản loại trừ, quyền lợi được chi trả như sau, sau khi trừ đi các Khoản Nợ (nếu có)", "o": ["Chi trả toàn bộ Phí Bảo Hiểm đã đóng, không có lãi", "25% Số Tiền Bảo Hiểm", "50% Số Tiền Bảo Hiểm", "75% Số Tiền Bảo Hiểm"], "e": "Với Người Được Bảo Hiểm từ 2 tuổi đến dưới 3 tuổi, quyền lợi tử vong là 50% Số Tiền Bảo Hiểm, sau khi trừ các Khoản Nợ, nếu có.", "r": "Điều 1"}, "en": {"q": "If the Life Assured is a child aged 2 to under 3 and dies (not excluded), what benefit is payable after deducting any Indebtedness?", "o": ["Refund of all premiums paid, without interest", "25% of Sum Assured", "50% of Sum Assured", "75% of Sum Assured"], "e": "For a Life Assured aged 2 to under 3, the death benefit is 50% of the Sum Assured, less any Indebtedness.", "r": "Article 1"}}, {"id": 4, "a": 1, "vi": {"q": "Trường hợp nào Prudential sẽ không chi trả quyền lợi bảo hiểm tử vong do Người Được Bảo Hiểm tự tử hoặc tự gây thương tích?", "o": ["Người Được Bảo Hiểm tự tử hoặc tự gây thương tích sau 03 năm kể từ ngày nộp khoản Phí Bảo Hiểm đầu tiên", "Người Được Bảo Hiểm tự tử hoặc tự gây thương tích, dù trong trạng thái tinh thần bình thường hay mất trí, trong thời hạn 02 năm kể từ ngày nộp khoản Phí Bảo Hiểm đầu tiên hoặc kể từ ngày Hợp Đồng Bảo Hiểm khôi phục hiệu lực gần nhất, tùy ngày nào đến sau", "Người Được Bảo Hiểm tử vong do bệnh thông thường", "Người Được Bảo Hiểm tử vong do tai nạn ngoài ý muốn"], "e": "Loại trừ áp dụng khi Người Được Bảo Hiểm tự tử hoặc tự gây thương tích, dù bình thường hay mất trí, trong 02 năm kể từ ngày nộp Phí Bảo Hiểm đầu tiên hoặc ngày khôi phục hiệu lực gần nhất, tùy ngày nào đến sau.", "r": "Điều 2.1(i)"}, "en": {"q": "In which case will Prudential NOT pay the death benefit due to suicide or self-inflicted injury of the Life Assured?", "o": ["Suicide or self-inflicted injury more than 3 years after payment of the first premium", "Suicide or self-inflicted injury, whether sane or insane, within 2 years from payment of the first premium or the latest reinstatement date, whichever is later", "Death from an ordinary illness", "Death from an unintended accident"], "e": "The exclusion applies to suicide or self-inflicted injury, whether sane or insane, within 2 years from the first premium payment date or the latest reinstatement date, whichever is later.", "r": "Article 2.1(i)"}}, {"id": 5, "a": 2, "vi": {"q": "Trường hợp nào thuộc loại trừ quyền lợi bảo hiểm tử vong do hành vi phạm tội hoặc lỗi cố ý của Bên Mua Bảo Hiểm?", "o": ["Người Được Bảo Hiểm tử vong do tai nạn sinh hoạt", "Người Được Bảo Hiểm tử vong do bệnh lý", "Do hành vi phạm tội (theo kết luận của cơ quan nhà nước có thẩm quyền) hoặc do lỗi cố ý của Bên Mua Bảo Hiểm gây ra cho Người Được Bảo Hiểm", "Người Được Bảo Hiểm tử vong do tuổi cao"], "e": "Prudential không chi trả quyền lợi tử vong nếu tử vong do hành vi phạm tội theo kết luận của cơ quan có thẩm quyền hoặc do lỗi cố ý của Bên Mua Bảo Hiểm.", "r": "Điều 2.1(ii)"}, "en": {"q": "Which case falls under the death benefit exclusion relating to a criminal act or the Policyowner's intentional act?", "o": ["Death of the Life Assured from a domestic accident", "Death of the Life Assured from illness", "Death caused by a criminal act (as concluded by a competent authority) or by an intentional act of the Policyowner against the Life Assured", "Death of the Life Assured from old age"], "e": "Prudential does not pay the death benefit if death results from a criminal act as concluded by a competent authority, or from an intentional act of the Policyowner.", "r": "Article 2.1(ii)"}}, {"id": 6, "a": 2, "vi": {"q": "Trường hợp nào Prudential sẽ không chi trả quyền lợi bảo hiểm tử vong do bản án của cơ quan có thẩm quyền?", "o": ["Người Được Bảo Hiểm tử vong do tai nạn giao thông", "Người Được Bảo Hiểm tử vong do bệnh lý", "Người Được Bảo Hiểm bị thi hành án tử hình", "Người Được Bảo Hiểm tử vong do tuổi già"], "e": "Người Được Bảo Hiểm bị thi hành án tử hình thuộc trường hợp loại trừ quyền lợi tử vong.", "r": "Điều 2.1(iv)"}, "en": {"q": "In which case will Prudential NOT pay the death benefit due to a judgment of a competent authority?", "o": ["Death in a traffic accident", "Death from illness", "The Life Assured is executed under a death sentence", "Death from old age"], "e": "Execution of the Life Assured under a death sentence is an exclusion of the death benefit.", "r": "Article 2.1(iv)"}}, {"id": 7, "a": 3, "vi": {"q": "Khi có hơn một Người Thụ Hưởng và một hoặc một số Người Thụ Hưởng cố ý gây ra tử vong cho Người Được Bảo Hiểm, Prudential sẽ chi trả như thế nào?", "o": ["Prudential không chi trả quyền lợi bảo hiểm tử vong cho bất kỳ Người Thụ Hưởng nào", "Prudential chia đều quyền lợi bảo hiểm tử vong cho tất cả Người Thụ Hưởng", "Prudential chi trả quyền lợi bảo hiểm tử vong cho Người Thụ Hưởng cố ý gây ra tử vong", "Prudential vẫn trả toàn bộ quyền lợi bảo hiểm tử vong cho những Người Thụ Hưởng còn lại theo tỷ lệ tương ứng với tỷ lệ mà Bên Mua Bảo Hiểm đã chỉ định"], "e": "Nếu một hoặc một số Người Thụ Hưởng cố ý gây tử vong, toàn bộ quyền lợi vẫn được trả cho những Người Thụ Hưởng còn lại theo tỷ lệ tương ứng đã được Bên Mua Bảo Hiểm chỉ định.", "r": "Điều 2.2"}, "en": {"q": "Where there is more than one Beneficiary and one or some of them intentionally cause the death of the Life Assured, how does Prudential pay?", "o": ["No death benefit is paid to any Beneficiary", "The death benefit is split equally among all Beneficiaries", "The death benefit is paid to the Beneficiary who intentionally caused the death", "The full death benefit is still paid to the remaining Beneficiaries in proportion to the shares designated by the Policyowner"], "e": "If one or some Beneficiaries intentionally cause the death, the full benefit is still paid to the remaining Beneficiaries in proportion to the shares designated by the Policyowner.", "r": "Article 2.2"}}, {"id": 8, "a": 0, "vi": {"q": "Theo quy tắc và điều khoản của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe, độ tuổi tham gia của NĐBH được quy định như thế nào?", "o": ["30 ngày tuổi – 70 tuổi", "0-70 tuổi", "0-65 tuổi", "0-60 tuổi"], "e": "Người Được Bảo Hiểm phải từ 30 ngày tuổi đến 70 tuổi tại thời điểm tham gia Hợp Đồng Bảo Hiểm.", "r": "Phần Định nghĩa, khoản 12"}, "en": {"q": "Under the T&C of PRUYên Tâm Vui Khỏe, what is the entry age of the Life Assured?", "o": ["30 days – 70 years", "0 – 70 years", "0 – 65 years", "0 – 60 years"], "e": "The Life Assured must be from 30 days to 70 years old at policy inception.", "r": "Definitions, item 12"}}, {"id": 9, "a": 1, "vi": {"q": "Theo quy tắc và điều khoản của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe, tuổi tối đa kết thúc Hợp Đồng Bảo Hiểm của Người Được Bảo Hiểm được quy định là bao nhiêu?", "o": ["99 tuổi", "80 tuổi", "75 tuổi", "70 tuổi"], "e": "Độ tuổi tối đa của Người Được Bảo Hiểm khi kết thúc Thời Hạn Bảo Hiểm là 80 tuổi.", "r": "Phần Định nghĩa, khoản 12"}, "en": {"q": "Under the T&C, what is the maximum age of the Life Assured at policy expiry?", "o": ["Age 99", "Age 80", "Age 75", "Age 70"], "e": "The maximum age of the Life Assured at the end of the Policy Term is 80.", "r": "Definitions, item 12"}}, {"id": 10, "a": 1, "vi": {"q": "Theo quy tắc và điều khoản của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe, thời hạn Hợp đồng được quy định như thế nào?", "o": ["10-30 năm", "5 – 40 năm", "10-20 năm", "50 năm"], "e": "Thời Hạn Bảo Hiểm tối thiểu 5 năm, tối đa 40 năm và không vượt quá Ngày Kỷ Niệm Hợp Đồng ngay sau sinh nhật lần thứ 80 của Người Được Bảo Hiểm.", "r": "Điều 17"}, "en": {"q": "Under the T&C, what is the Policy Term?", "o": ["10 – 30 years", "5 – 40 years", "10 – 20 years", "50 years"], "e": "The Policy Term is a minimum of 5 years and a maximum of 40 years, and must not go beyond the Policy Anniversary immediately following the Life Assured's 80th birthday.", "r": "Article 17"}}, {"id": 11, "a": 3, "vi": {"q": "Với Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe, định kỳ đóng phí được quy định như thế nào?", "o": ["Chỉ đóng phí tháng", "Hàng quý/Hàng nửa năm", "Chỉ đóng nửa năm", "Hàng quý/Hàng nửa năm/Hàng năm"], "e": "Điều 10 quy định định kỳ đóng phí được ghi trên Giấy Chứng Nhận Bảo Hiểm và có thể thay đổi theo quy định Prudential. Các lựa chọn quý/nửa năm/năm là thông số sản phẩm trong tài liệu bán hàng, không được liệt kê cụ thể trong T&C.", "r": "Điều 10"}, "en": {"q": "What premium payment frequencies apply to PRUYên Tâm Vui Khỏe?", "o": ["Monthly only", "Quarterly / Half-yearly", "Half-yearly only", "Quarterly / Half-yearly / Yearly"], "e": "Article 10 states that the premium payment frequency is shown on the Policy Certificate and may be changed under Prudential's rules. The quarterly / half-yearly / yearly options are product parameters from sales materials and are not listed in the T&C.", "r": "Article 10"}, "v": 1}, {"id": 12, "a": 0, "vi": {"q": "Phí Bảo Hiểm tối thiểu của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe được quy định như thế nào?", "o": ["3 triệu đồng đối với Người Được Bảo Hiểm từ 16 tuổi trở lên; 1,5 triệu đồng đối với Người Được Bảo Hiểm dưới 16 tuổi", "4 triệu đồng đối với Người Được Bảo Hiểm từ 16 tuổi trở lên; 1,5 triệu đồng đối với Người Được Bảo Hiểm dưới 16 tuổi", "5 triệu đồng đối với Người Được Bảo Hiểm từ 16 tuổi trở lên; 2 triệu đồng đối với Người Được Bảo Hiểm dưới 16 tuổi", "6 triệu đồng đối với Người Được Bảo Hiểm từ 16 tuổi trở lên; 3 triệu đồng đối với Người Được Bảo Hiểm dưới 16 tuổi"], "e": "T&C, Điều 9 chỉ định nghĩa Phí Bảo Hiểm và không nêu mức phí tối thiểu 3 triệu/1,5 triệu đồng. Mức này cần đối chiếu tài liệu sản phẩm hoặc quy định nghiệp vụ hiện hành.", "r": "Điều 9"}, "en": {"q": "What is the minimum premium of PRUYên Tâm Vui Khỏe?", "o": ["VND 3 million for Life Assured aged 16 and above; VND 1.5 million for Life Assured under 16", "VND 4 million for Life Assured aged 16 and above; VND 1.5 million for Life Assured under 16", "VND 5 million for Life Assured aged 16 and above; VND 2 million for Life Assured under 16", "VND 6 million for Life Assured aged 16 and above; VND 3 million for Life Assured under 16"], "e": "Article 9 of the T&C only defines Premium and does not state the VND 3 million / VND 1.5 million minimum. Verify against product materials or current operational rules.", "r": "Article 9"}, "v": 1}, {"id": 13, "a": 1, "vi": {"q": "Số tiền Bảo Hiểm tối thiểu của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe được quy định là bao nhiêu?", "o": ["100 triệu đồng", "150 triệu đồng", "200 triệu đồng", "250 triệu đồng"], "e": "T&C, phần Định nghĩa khoản 19 chỉ định nghĩa Số Tiền Bảo Hiểm và không nêu mức tối thiểu 150 triệu đồng. Mức này cần đối chiếu tài liệu sản phẩm hoặc quy định nghiệp vụ hiện hành.", "r": "Định nghĩa, khoản 19"}, "en": {"q": "What is the minimum Sum Assured of PRUYên Tâm Vui Khỏe?", "o": ["VND 100 million", "VND 150 million", "VND 200 million", "VND 250 million"], "e": "Definitions, item 19 of the T&C only defines Sum Assured and does not state the VND 150 million minimum. Verify against product materials or current operational rules.", "r": "Definitions, item 19"}, "v": 1}, {"id": 14, "a": 1, "vi": {"q": "Ngoài Thời Hạn Cân Nhắc, Bên Mua Bảo Hiểm có thể yêu cầu tăng Số Tiền Bảo Hiểm trong khoảng thời gian nào?", "o": ["Chỉ trong Năm Hợp Đồng thứ nhất", "Từ Ngày Kỷ Niệm Năm Hợp Đồng thứ 2 đến Ngày Kỷ Niệm Năm Hợp Đồng ngay sau sinh nhật lần thứ 71 của Người Được Bảo Hiểm; tối đa một lần trong một Năm Hợp Đồng", "Từ Năm Hợp Đồng thứ 3 và không giới hạn số lần thay đổi", "Vào bất kỳ thời điểm nào cho đến Ngày Đáo Hạn Hợp Đồng"], "e": "Ngoài Thời Hạn Cân Nhắc, có thể tăng Số Tiền Bảo Hiểm từ Ngày Kỷ Niệm Năm Hợp Đồng thứ 2 đến Ngày Kỷ Niệm Năm Hợp Đồng ngay sau sinh nhật lần thứ 71; tối đa 1 lần trong một Năm Hợp Đồng.", "r": "Điều 13.3.1"}, "en": {"q": "Outside the Free-look Period, when may the Policyowner request an increase in Sum Assured?", "o": ["Only in the first Policy Year", "From the 2nd Policy Anniversary to the Policy Anniversary immediately following the Life Assured's 71st birthday; at most once per Policy Year", "From the 3rd Policy Year, with no limit on the number of changes", "At any time up to the Maturity Date"], "e": "Outside the Free-look Period, the Sum Assured may be increased from the 2nd Policy Anniversary to the Policy Anniversary immediately following the 71st birthday; at most once per Policy Year.", "r": "Article 13.3.1"}}, {"id": 15, "a": 2, "vi": {"q": "Chọn phát biểu SAI về quyền thay đổi Số Tiền Bảo Hiểm trong thời gian Hợp Đồng Bảo Hiểm có hiệu lực:", "o": ["Số Tiền Bảo Hiểm mới và Phí Bảo Hiểm điều chỉnh có hiệu lực từ Ngày Kỷ Niệm Năm Hợp Đồng ngay sau khi yêu cầu được Prudential chấp thuận", "Khi yêu cầu tăng Số Tiền Bảo Hiểm, Prudential có thể yêu cầu Người Được Bảo Hiểm kiểm tra sức khỏe; chi phí kiểm tra do Prudential chi trả", "Bên Mua Bảo Hiểm có thể yêu cầu tăng Số Tiền Bảo Hiểm sau Ngày Kỷ Niệm Năm Hợp Đồng ngay sau sinh nhật lần thứ 71 của Người Được Bảo Hiểm", "Bên Mua Bảo Hiểm có thể yêu cầu giảm Số Tiền Bảo Hiểm trước ngày kết thúc Thời Hạn Bảo Hiểm"], "e": "Không cho phép yêu cầu tăng sau mốc Ngày Kỷ Niệm Năm Hợp Đồng ngay sau sinh nhật lần thứ 71. Các phát biểu còn lại phù hợp quy định về hiệu lực thay đổi, kiểm tra sức khỏe và giảm Số Tiền Bảo Hiểm.", "r": "Điều 13.3.1"}, "en": {"q": "Choose the INCORRECT statement about changing the Sum Assured while the Policy is in force:", "o": ["The new Sum Assured and adjusted premium take effect from the Policy Anniversary immediately after Prudential approves the request", "For an increase, Prudential may require a medical examination of the Life Assured, at Prudential's cost", "The Policyowner may request an increase after the Policy Anniversary immediately following the Life Assured's 71st birthday", "The Policyowner may request a decrease in Sum Assured before the end of the Policy Term"], "e": "No increase may be requested after the Policy Anniversary immediately following the 71st birthday. The other statements are consistent with the rules on the effective date of change, medical examination and reduction of Sum Assured.", "r": "Article 13.3.1"}}, {"id": 16, "a": 3, "vi": {"q": "Khi tham gia Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe, Bên mua Bảo hiểm có thể tham gia thêm (các) Bảo hiểm Bán cùng nào dưới đây?", "o": ["Bảo Hiểm Tai Nạn; Bảo Hiểm Nhân Thọ Có Kỳ Hạn", "BH Miễn đóng phí; PRUKhỏe Linh Hoạt", "BH Bệnh Lý Nghiêm Trọng; BH Hỗ Trợ Đóng Phí Bệnh Lý Nghiêm Trọng", "Bảo Hiểm Tai Nạn; Bảo Hiểm Nhân Thọ Có Kỳ Hạn; BH Miễn đóng phí; PRUKhỏe Linh Hoạt; BH Bệnh Lý Nghiêm Trọng; BH Hỗ Trợ Đóng Phí Bệnh Lý Nghiêm Trọng; BH Hỗ Trợ Viện Phí Mở Rộng"], "e": "T&C, phần Định nghĩa khoản 2 và Điều 13.3.2 quy định nguyên tắc tham gia Bảo Hiểm Bán Cùng nhưng không liệt kê tên từng sản phẩm. Danh sách cụ thể phải đối chiếu brochure hoặc tài liệu sản phẩm hiện hành.", "r": "Định nghĩa khoản 2 · Điều 13.3.2"}, "en": {"q": "When buying PRUYên Tâm Vui Khỏe, which rider(s) may the Policyowner add?", "o": ["Accident; Term Life", "Waiver of Premium; PRUKhỏe Linh Hoạt", "Critical Illness; Critical Illness Premium Support", "Accident; Term Life; Waiver of Premium; PRUKhỏe Linh Hoạt; Critical Illness; Critical Illness Premium Support; Extended Hospital Income"], "e": "Definitions, item 2 and Article 13.3.2 set out the principles for adding riders but do not list each product by name. Verify the exact list against the current brochure or product materials.", "r": "Definitions, item 2 · Article 13.3.2"}, "v": 1}, {"id": 17, "a": 3, "vi": {"q": "Chọn phát biểu chính xác nhất về quyền bổ sung, chấm dứt hiệu lực (các) Bảo hiểm Bán cùng khi tham gia Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe", "o": ["Có thể tham gia thêm tại thời điểm phát hành hoặc trong thời gian Hợp Đồng Bảo Hiểm có hiệu lực, tùy thuộc Quy Tắc và Điều Khoản của Bảo Hiểm Bán Cùng", "Việc tham gia thêm hoặc chấm dứt Bảo Hiểm Bán Cùng làm tăng hoặc giảm Phí Bảo Hiểm tương ứng", "Ngày có hiệu lực hoặc chấm dứt hiệu lực được xác định theo Quy Tắc và Điều Khoản của Bảo Hiểm Bán Cùng tương ứng", "Cả A, B và C đều đúng"], "e": "Có thể bổ sung hoặc chấm dứt Bảo Hiểm Bán Cùng trong thời gian hợp đồng có hiệu lực, tùy thuộc T&C của sản phẩm đó; Phí Bảo Hiểm tăng hoặc giảm tương ứng và ngày hiệu lực thực hiện theo T&C tương ứng.", "r": "Điều 13.3.2"}, "en": {"q": "Choose the most accurate statement about adding or terminating rider(s) with PRUYên Tâm Vui Khỏe", "o": ["Riders may be added at issuance or while the Policy is in force, subject to the rider's T&C", "Adding or terminating a rider increases or decreases the premium accordingly", "The effective or termination date is determined by the respective rider's T&C", "A, B and C are all correct"], "e": "Riders may be added or terminated while the Policy is in force, subject to their T&C; the premium increases or decreases accordingly, and the effective date follows the respective T&C.", "r": "Article 13.3.2"}, "m": 1}, {"id": 18, "a": 2, "vi": {"q": "Thời hạn Bảo hiểm tạm thời của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe bắt đầu từ thời điểm nào?", "o": ["Prudential cấp Giấy Chứng Nhận Bảo Hiểm", "Prudential ban hành văn bản từ chối bảo hiểm", "Prudential nhận được Hồ Sơ Yêu Cầu Bảo Hiểm hợp lệ và BMBH hoàn tất thanh toán phí BH tạm tính", "Ngày Prudential tạm hoãn chấp nhận bảo hiểm"], "e": "Bảo Hiểm Tạm Thời bắt đầu khi Prudential nhận Hồ Sơ Yêu Cầu Bảo Hiểm hợp lệ và Bên Mua Bảo Hiểm hoàn tất thanh toán Phí Bảo Hiểm Tạm Tính.", "r": "Điều 3"}, "en": {"q": "When does the Interim Cover of PRUYên Tâm Vui Khỏe start?", "o": ["When Prudential issues the Policy Certificate", "When Prudential issues a decline letter", "When Prudential receives a valid Application and the Policyowner has paid the Provisional Premium in full", "On the date Prudential postpones acceptance"], "e": "Interim Cover starts when Prudential receives a valid Application and the Policyowner has paid the Provisional Premium in full.", "r": "Article 3"}}, {"id": 19, "a": 3, "vi": {"q": "Thời hạn Bảo hiểm tạm thời của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe kết thúc vào một trong các ngày sau, tùy ngày nào đến trước:", "o": ["Ngày Prudential cấp Giấy Chứng Nhận Bảo Hiểm", "Ngày Prudential tạm hoãn chấp nhận bảo hiểm hoặc ban hành văn bản từ chối bảo hiểm", "Ngày Bên Mua Bảo Hiểm yêu cầu hủy bỏ Hồ Sơ Yêu Cầu Bảo Hiểm", "Tất cả các đáp án trên"], "e": "Bảo Hiểm Tạm Thời kết thúc vào ngày đến trước trong các ngày: cấp Giấy Chứng Nhận Bảo Hiểm, tạm hoãn chấp nhận, ban hành văn bản từ chối, hoặc Bên Mua Bảo Hiểm yêu cầu hủy hồ sơ.", "r": "Điều 3"}, "en": {"q": "The Interim Cover ends on one of the following dates, whichever comes first:", "o": ["The date Prudential issues the Policy Certificate", "The date Prudential postpones acceptance or issues a decline letter", "The date the Policyowner requests cancellation of the Application", "All of the above"], "e": "Interim Cover ends on the earliest of: issue of the Policy Certificate, postponement, issue of a decline letter, or the Policyowner's request to cancel the Application.", "r": "Article 3"}, "m": 1}, {"id": 20, "a": 1, "vi": {"q": "Trong Thời Hạn Bảo Hiểm Tạm Thời, nếu Người Được Bảo Hiểm tử vong do Tai Nạn và tổng phí bảo hiểm đã đóng của tất cả hồ sơ đang chờ thẩm định của cùng Người Được Bảo Hiểm nhỏ hơn hoặc bằng 200 triệu đồng, Prudential chi trả như thế nào?", "o": ["Tổng Số Tiền Bảo Hiểm của các sản phẩm chính, không giới hạn số tiền", "Số tiền nhỏ hơn giữa 200 triệu đồng và tổng Số Tiền Bảo Hiểm của sản phẩm chính ghi trên tất cả hồ sơ đang chờ thẩm định của cùng Người Được Bảo Hiểm", "Hoàn lại tổng phí bảo hiểm đã đóng, có lãi", "Cố định 200 triệu đồng trong mọi trường hợp"], "e": "Khi tổng phí đã đóng không quá 200 triệu đồng, số tiền chi trả là số nhỏ hơn giữa 200 triệu đồng và tổng Số Tiền Bảo Hiểm của sản phẩm chính trên tất cả hồ sơ đang chờ thẩm định của cùng Người Được Bảo Hiểm.", "r": "Điều 4(i)"}, "en": {"q": "During Interim Cover, if the Life Assured dies from an Accident and the total premium paid on all pending applications for the same Life Assured is VND 200 million or less, how does Prudential pay?", "o": ["The total Sum Assured of the basic products, with no cap", "The lower of VND 200 million and the total basic-product Sum Assured on all pending applications for the same Life Assured", "A refund of total premium paid, with interest", "A fixed VND 200 million in all cases"], "e": "When total premium paid does not exceed VND 200 million, the payout is the lower of VND 200 million and the total basic-product Sum Assured on all pending applications for the same Life Assured.", "r": "Article 4(i)"}}, {"id": 21, "a": 1, "vi": {"q": "Trong Thời Hạn Bảo Hiểm Tạm Thời, nếu Người Được Bảo Hiểm tử vong do Tai Nạn và tổng phí bảo hiểm đã đóng của tất cả hồ sơ đang chờ thẩm định của cùng Người Được Bảo Hiểm lớn hơn 200 triệu đồng, Prudential xử lý như thế nào?", "o": ["Chi trả số tiền nhỏ hơn giữa 200 triệu đồng và tổng Số Tiền Bảo Hiểm của sản phẩm chính", "Hoàn lại tổng phí bảo hiểm đã đóng, không có lãi, thay cho Bảo Hiểm Tạm Thời", "Chi trả cố định 200 triệu đồng và hoàn lại toàn bộ phí", "Chi trả toàn bộ tổng Số Tiền Bảo Hiểm của các hồ sơ đang chờ thẩm định"], "e": "Khi tổng phí đã đóng của các hồ sơ đang chờ thẩm định lớn hơn 200 triệu đồng, Prudential hoàn lại tổng phí đã đóng, không có lãi, thay cho Bảo Hiểm Tạm Thời.", "r": "Điều 4(ii)"}, "en": {"q": "During Interim Cover, if the Life Assured dies from an Accident and the total premium paid on all pending applications for the same Life Assured exceeds VND 200 million, how does Prudential handle it?", "o": ["Pay the lower of VND 200 million and the total basic-product Sum Assured", "Refund the total premium paid, without interest, in lieu of Interim Cover", "Pay a fixed VND 200 million and refund all premiums", "Pay the full total Sum Assured of the pending applications"], "e": "When total premium paid on pending applications exceeds VND 200 million, Prudential refunds the total premium paid, without interest, in lieu of Interim Cover.", "r": "Article 4(ii)"}}, {"id": 22, "a": 1, "vi": {"q": "Thời gian gia hạn đóng phí của Sản phẩm Bảo hiểm tử kỳ PRUYên Tâm Vui Khỏe là bao nhiêu ngày?", "o": ["30 ngày", "60 ngày", "90 ngày", "180 ngày"], "e": "Thời gian gia hạn đóng phí là 60 ngày tính từ ngày đến hạn đóng phí; trong thời gian này Hợp Đồng Bảo Hiểm vẫn có hiệu lực.", "r": "Điều 12.1"}, "en": {"q": "How many days is the grace period of PRUYên Tâm Vui Khỏe?", "o": ["30 days", "60 days", "90 days", "180 days"], "e": "The grace period is 60 days from the premium due date; the Policy remains in force during this period.", "r": "Article 12.1"}}, {"id": 23, "a": 2, "vi": {"q": "Nếu Sự Kiện Bảo Hiểm xảy ra trong thời gian gia hạn đóng phí và được Prudential chấp thuận, quyền lợi bảo hiểm sẽ được chi trả như thế nào?", "o": ["Không chi trả", "Chi trả toàn bộ và không khấu trừ", "Chi trả sau khi đã khấu trừ Phí Bảo Hiểm Đến Hạn và (các) Khoản Nợ, nếu có", "Tất cả đều đúng"], "e": "Nếu Sự Kiện Bảo Hiểm xảy ra trong thời gian gia hạn và được chấp thuận, quyền lợi được chi trả sau khi khấu trừ Phí Bảo Hiểm Đến Hạn và các Khoản Nợ, nếu có.", "r": "Điều 12.3"}, "en": {"q": "If an Insured Event occurs during the grace period and is approved by Prudential, how is the benefit paid?", "o": ["Not paid", "Paid in full with no deduction", "Paid after deducting the Premium Due and any Indebtedness", "All of the above"], "e": "If an Insured Event occurs during the grace period and is approved, the benefit is paid after deducting the Premium Due and any Indebtedness.", "r": "Article 12.3"}}, {"id": 24, "a": 3, "vi": {"q": "Sau khi kết thúc thời gian gia hạn đóng phí, nếu Bên Mua Bảo Hiểm vẫn không đóng đủ Phí Bảo Hiểm Đến Hạn, Hợp Đồng Bảo Hiểm sẽ ở trạng thái nào?", "o": ["Tiếp tục có hiệu lực và tự động gia hạn thêm 60 ngày", "Tạm dừng nhưng vẫn được bảo hiểm đầy đủ", "Chấm dứt vào ngày cuối cùng của thời gian gia hạn", "Mất hiệu lực kể từ ngày đến hạn đóng phí bảo hiểm"], "e": "Nếu hết thời gian gia hạn mà chưa đóng đủ Phí Bảo Hiểm Đến Hạn, hợp đồng mất hiệu lực kể từ ngày đến hạn đóng phí.", "r": "Điều 12.2"}, "en": {"q": "After the grace period ends, if the Policyowner still has not paid the Premium Due in full, what is the status of the Policy?", "o": ["Remains in force and is automatically extended by another 60 days", "Suspended but still fully covered", "Terminated on the last day of the grace period", "Lapsed from the premium due date"], "e": "If the Premium Due is not paid in full by the end of the grace period, the Policy lapses from the premium due date.", "r": "Article 12.2"}}, {"id": 25, "a": 2, "vi": {"q": "Nếu Hợp Đồng Bảo Hiểm đã mất hiệu lực trong 24 tháng liên tục, hệ quả nào sau đây là đúng?", "o": ["Hợp Đồng Bảo Hiểm tự động khôi phục hiệu lực", "Hợp Đồng Bảo Hiểm tiếp tục được gia hạn đóng phí", "Hợp Đồng Bảo Hiểm chấm dứt hiệu lực", "Prudential vẫn chi trả Số Tiền Bảo Hiểm cho sự kiện xảy ra sau đó"], "e": "Hợp Đồng Bảo Hiểm chấm dứt hiệu lực khi đã mất hiệu lực trong 24 tháng liên tục.", "r": "Điều 19(iv)"}, "en": {"q": "If the Policy has been lapsed for 24 consecutive months, which consequence is correct?", "o": ["The Policy is automatically reinstated", "The Policy continues to have a grace period", "The Policy is terminated", "Prudential still pays the Sum Assured for subsequent events"], "e": "The Policy terminates once it has been lapsed for 24 consecutive months.", "r": "Article 19(iv)"}}, {"id": 26, "a": 2, "vi": {"q": "Nếu Người Được Bảo Hiểm tự gây thương tích, dù trong trạng thái tinh thần bình thường hay mất trí, trong thời hạn 02 năm áp dụng điều khoản loại trừ và tử vong, Prudential xử lý như thế nào?", "o": ["Chi trả 100% Số Tiền Bảo Hiểm", "Chi trả 50% Số Tiền Bảo Hiểm", "Chi trả cho Bên Mua Bảo Hiểm tổng phí bảo hiểm đã đóng, không có lãi, sau khi khấu trừ các Khoản Nợ và chi phí khám, xét nghiệm y khoa, nếu có; sau đó Hợp Đồng Bảo Hiểm chấm dứt hiệu lực", "Không chi trả quyền lợi và cũng không hoàn lại phí"], "e": "Với trường hợp loại trừ, Prudential chi trả tổng phí đã đóng, không có lãi, sau khi trừ Khoản Nợ và chi phí khám, xét nghiệm y khoa, nếu có; sau đó hợp đồng chấm dứt hiệu lực.", "r": "Điều 2.3"}, "en": {"q": "If the Life Assured self-inflicts injury, whether sane or insane, within the 2-year exclusion period and dies, how does Prudential handle it?", "o": ["Pay 100% of Sum Assured", "Pay 50% of Sum Assured", "Pay the Policyowner the total premium paid, without interest, less any Indebtedness and medical examination costs; the Policy then terminates", "Pay no benefit and refund no premium"], "e": "For excluded cases, Prudential pays the total premium paid, without interest, less any Indebtedness and medical examination costs; the Policy then terminates.", "r": "Article 2.3"}}, {"id": 27, "a": 1, "vi": {"q": "BMBH cần gửi yêu cầu khôi phục hiệu lực Hợp Đồng Bảo Hiểm trong thời gian nào?", "o": ["Trong vòng 12 tháng", "Trong 24 tháng kể từ ngày mất hiệu lực gần nhất nhưng không trễ hơn Ngày Đáo Hạn Hợp Đồng", "Trong thời gian gia hạn", "Bất kỳ thời điểm nào"], "e": "Yêu cầu khôi phục phải được nộp trong 24 tháng kể từ ngày mất hiệu lực gần nhất và không trễ hơn Ngày Đáo Hạn Hợp Đồng.", "r": "Điều 13.3.6(i)"}, "en": {"q": "Within what period must the Policyowner submit a reinstatement request?", "o": ["Within 12 months", "Within 24 months from the latest lapse date, but no later than the Maturity Date", "Within the grace period", "At any time"], "e": "A reinstatement request must be submitted within 24 months from the latest lapse date and no later than the Maturity Date.", "r": "Article 13.3.6(i)"}}, {"id": 28, "a": 2, "vi": {"q": "Điều kiện để khôi phục hiệu lực Hợp Đồng Bảo Hiểm là gì?", "o": ["Chỉ cần nộp yêu cầu bằng văn bản", "Chỉ cần đóng đầy đủ khoản tiền để khôi phục hiệu lực", "Nộp yêu cầu đúng hạn; đóng đầy đủ khoản tiền để khôi phục; đồng thời Bên Mua Bảo Hiểm và Người Được Bảo Hiểm đáp ứng mọi điều kiện bảo hiểm tại thời điểm yêu cầu", "Không cần đáp ứng điều kiện nào nếu Hợp Đồng Bảo Hiểm đã từng có hiệu lực"], "e": "Cần đồng thời nộp yêu cầu đúng hạn, đóng đầy đủ khoản tiền khôi phục và đáp ứng mọi điều kiện bảo hiểm tại thời điểm yêu cầu.", "r": "Điều 13.3.6"}, "en": {"q": "What are the conditions for reinstating the Policy?", "o": ["A written request only", "Full payment of the reinstatement amount only", "A timely request; full payment of the reinstatement amount; and the Policyowner and Life Assured meet all insurability conditions at the time of request", "No conditions if the Policy was previously in force"], "e": "All three are required: a timely request, full payment of the reinstatement amount, and meeting all insurability conditions at the time of request.", "r": "Article 13.3.6"}}, {"id": 29, "a": 1, "vi": {"q": "Theo Quy Tắc và Điều Khoản, Thời Hạn Cân Nhắc của Hợp Đồng Bảo Hiểm là bao lâu?", "o": ["14 ngày kể từ Ngày Hiệu Lực Hợp Đồng", "21 ngày kể từ ngày Bên Mua Bảo Hiểm xác nhận đã nhận đủ các tài liệu theo quy định", "30 ngày kể từ ngày đóng kỳ phí đầu tiên", "60 ngày kể từ ngày phát hành Hợp Đồng Bảo Hiểm"], "e": "Thời Hạn Cân Nhắc là 21 ngày kể từ ngày Bên Mua Bảo Hiểm xác nhận đã nhận đủ ba tài liệu theo quy định.", "r": "Phần Định nghĩa, khoản 22"}, "en": {"q": "Under the T&C, how long is the Free-look Period?", "o": ["14 days from the Policy Effective Date", "21 days from the date the Policyowner confirms receipt of all required documents", "30 days from payment of the first premium", "60 days from policy issuance"], "e": "The Free-look Period is 21 days from the date the Policyowner confirms receipt of the three required documents.", "r": "Definitions, item 22"}}, {"id": 30, "a": 3, "vi": {"q": "Tài liệu nào sau đây KHÔNG thuộc ba tài liệu dùng để xác định thời điểm bắt đầu Thời Hạn Cân Nhắc?", "o": ["Tài liệu tóm tắt Quy Tắc và Điều Khoản của Sản Phẩm Bảo Hiểm Chính", "Tài liệu minh họa bán hàng của Sản Phẩm Bảo Hiểm Chính", "Giấy Chứng Nhận Bảo Hiểm", "Biên bản khám sức khỏe của Người Được Bảo Hiểm"], "e": "Ba tài liệu gồm bản tóm tắt T&C, tài liệu minh họa bán hàng và Giấy Chứng Nhận Bảo Hiểm; biên bản khám sức khỏe không thuộc danh sách này.", "r": "Phần Định nghĩa, khoản 22"}, "en": {"q": "Which of the following is NOT one of the three documents used to determine the start of the Free-look Period?", "o": ["Summary of the T&C of the basic product", "Sales illustration of the basic product", "Policy Certificate", "Medical examination report of the Life Assured"], "e": "The three documents are the T&C summary, the sales illustration and the Policy Certificate; the medical examination report is not one of them.", "r": "Definitions, item 22"}}, {"id": 31, "a": 2, "vi": {"q": "Theo định nghĩa trong Quy Tắc và Điều Khoản, Tai Nạn phải là nguyên nhân trực tiếp, duy nhất và không liên quan đến nguyên nhân nào khác gây thương tật hoặc tử vong trong thời hạn nào kể từ ngày xảy ra Tai Nạn?", "o": ["30 ngày", "90 ngày", "180 ngày", "365 ngày"], "e": "Tai Nạn phải là nguyên nhân trực tiếp, duy nhất gây thương tật hoặc tử vong trong vòng 180 ngày kể từ ngày xảy ra Tai Nạn.", "r": "Phần Định nghĩa, khoản 21"}, "en": {"q": "By definition in the T&C, an Accident must be the direct and sole cause, independent of any other cause, of injury or death within what period from the date of the Accident?", "o": ["30 days", "90 days", "180 days", "365 days"], "e": "An Accident must be the direct and sole cause of injury or death within 180 days from the date of the Accident.", "r": "Definitions, item 21"}}, {"id": 32, "a": 2, "vi": {"q": "Nếu Người Được Bảo Hiểm tử vong khi dưới 1 tuổi và không thuộc trường hợp loại trừ, quyền lợi bảo hiểm được chi trả như thế nào, sau khi trừ các Khoản Nợ, nếu có?", "o": ["25% Số Tiền Bảo Hiểm", "50% Số Tiền Bảo Hiểm", "Hoàn lại toàn bộ Phí Bảo Hiểm đã đóng cho Sản Phẩm Bảo Hiểm Chính này, không có lãi", "100% Số Tiền Bảo Hiểm"], "e": "Nếu tử vong khi dưới 1 tuổi, Prudential hoàn lại toàn bộ Phí Bảo Hiểm đã đóng cho sản phẩm này, không có lãi, sau khi trừ Khoản Nợ nếu có.", "r": "Điều 1"}, "en": {"q": "If the Life Assured dies under age 1 and the event is not excluded, what is payable after deducting any Indebtedness?", "o": ["25% of Sum Assured", "50% of Sum Assured", "Refund of all premiums paid for this basic product, without interest", "100% of Sum Assured"], "e": "If death occurs under age 1, Prudential refunds all premiums paid for this product, without interest, less any Indebtedness.", "r": "Article 1"}}, {"id": 33, "a": 0, "vi": {"q": "Nếu Người Được Bảo Hiểm tử vong từ 1 tuổi đến dưới 2 tuổi và không thuộc trường hợp loại trừ, quyền lợi bảo hiểm được chi trả bằng bao nhiêu, sau khi trừ các Khoản Nợ, nếu có?", "o": ["25% Số Tiền Bảo Hiểm", "50% Số Tiền Bảo Hiểm", "75% Số Tiền Bảo Hiểm", "100% Số Tiền Bảo Hiểm"], "e": "Nếu tử vong từ 1 tuổi đến dưới 2 tuổi, quyền lợi là 25% Số Tiền Bảo Hiểm, sau khi trừ Khoản Nợ nếu có.", "r": "Điều 1"}, "en": {"q": "If the Life Assured dies aged 1 to under 2 and the event is not excluded, what is payable after deducting any Indebtedness?", "o": ["25% of Sum Assured", "50% of Sum Assured", "75% of Sum Assured", "100% of Sum Assured"], "e": "For death at age 1 to under 2, the benefit is 25% of the Sum Assured, less any Indebtedness.", "r": "Article 1"}}, {"id": 34, "a": 2, "vi": {"q": "Nếu Người Được Bảo Hiểm tử vong từ 3 tuổi đến dưới 4 tuổi và không thuộc trường hợp loại trừ, quyền lợi bảo hiểm được chi trả bằng bao nhiêu, sau khi trừ các Khoản Nợ, nếu có?", "o": ["25% Số Tiền Bảo Hiểm", "50% Số Tiền Bảo Hiểm", "75% Số Tiền Bảo Hiểm", "100% Số Tiền Bảo Hiểm"], "e": "Nếu tử vong từ 3 tuổi đến dưới 4 tuổi, quyền lợi là 75% Số Tiền Bảo Hiểm, sau khi trừ Khoản Nợ nếu có.", "r": "Điều 1"}, "en": {"q": "If the Life Assured dies aged 3 to under 4 and the event is not excluded, what is payable after deducting any Indebtedness?", "o": ["25% of Sum Assured", "50% of Sum Assured", "75% of Sum Assured", "100% of Sum Assured"], "e": "For death at age 3 to under 4, the benefit is 75% of the Sum Assured, less any Indebtedness.", "r": "Article 1"}}, {"id": 35, "a": 1, "vi": {"q": "Trong Thời Hạn Bảo Hiểm Tạm Thời, trường hợp nào sau đây không được chi trả Số Tiền Bảo Hiểm Tạm Thời?", "o": ["Người Được Bảo Hiểm tử vong do Tai Nạn và không thuộc trường hợp loại trừ", "Người Được Bảo Hiểm tử vong không phải do Tai Nạn", "Người Được Bảo Hiểm tử vong do Tai Nạn khách quan, ngoài ý muốn", "Người Được Bảo Hiểm tử vong do Tai Nạn và nguyên nhân không liên quan chất kích thích"], "e": "Prudential không chi trả Số Tiền Bảo Hiểm Tạm Thời nếu Người Được Bảo Hiểm tử vong không phải do Tai Nạn hoặc thuộc một trong các nguyên nhân loại trừ được liệt kê.", "r": "Điều 5"}, "en": {"q": "During Interim Cover, in which case is the Interim Sum Assured NOT payable?", "o": ["Death from an Accident not falling under any exclusion", "Death not caused by an Accident", "Death from an objective, unintended Accident", "Death from an Accident unrelated to stimulants"], "e": "Prudential does not pay the Interim Sum Assured if the Life Assured's death is not caused by an Accident or falls under one of the listed exclusions.", "r": "Article 5"}}, {"id": 36, "a": 2, "vi": {"q": "Trong Thời Hạn Bảo Hiểm Tạm Thời, nếu Người Được Bảo Hiểm tử vong thuộc một trường hợp loại trừ, Prudential xử lý như thế nào?", "o": ["Chi trả 100% Số Tiền Bảo Hiểm", "Chi trả tối đa 200 triệu đồng", "Hoàn trả tổng phí bảo hiểm đã đóng của tất cả hồ sơ đang chờ thẩm định, không có lãi, sau khi trừ chi phí khám, xét nghiệm y khoa, nếu có", "Không chi trả và không hoàn lại bất kỳ khoản nào"], "e": "Nếu tử vong thuộc loại trừ của Bảo Hiểm Tạm Thời, Prudential hoàn trả tổng phí đã đóng của các hồ sơ đang chờ thẩm định, không có lãi, sau khi trừ chi phí khám, xét nghiệm y khoa nếu có.", "r": "Điều 5"}, "en": {"q": "During Interim Cover, if the death of the Life Assured falls under an exclusion, how does Prudential handle it?", "o": ["Pay 100% of Sum Assured", "Pay up to VND 200 million", "Refund total premium paid on all pending applications, without interest, less medical examination costs, if any", "Pay nothing and refund nothing"], "e": "If death falls under an Interim Cover exclusion, Prudential refunds total premium paid on pending applications, without interest, less medical examination costs, if any.", "r": "Article 5"}}, {"id": 37, "a": 1, "vi": {"q": "Thời hạn yêu cầu giải quyết quyền lợi bảo hiểm được xác định như thế nào?", "o": ["06 tháng kể từ ngày xảy ra Sự Kiện Bảo Hiểm", "01 năm kể từ ngày xảy ra Sự Kiện Bảo Hiểm; hoặc từ ngày Người Nhận Quyền Lợi Bảo Hiểm biết sự kiện nếu chứng minh được mình không biết ngày xảy ra sự kiện", "02 năm kể từ ngày xảy ra Sự Kiện Bảo Hiểm", "Không giới hạn thời gian"], "e": "Thời hạn yêu cầu là 01 năm từ ngày xảy ra Sự Kiện Bảo Hiểm; hoặc từ ngày người nhận quyền lợi biết sự kiện nếu chứng minh được mình không biết ngày xảy ra sự kiện.", "r": "Điều 6"}, "en": {"q": "How is the time limit for submitting a claim determined?", "o": ["6 months from the Insured Event", "1 year from the Insured Event; or from the date the Claimant became aware of it, if they can prove they did not know when it occurred", "2 years from the Insured Event", "No time limit"], "e": "The time limit is 1 year from the Insured Event; or from the date the Claimant became aware of it, if they can prove they did not know when it occurred.", "r": "Article 6"}}, {"id": 38, "a": 2, "vi": {"q": "Prudential có nghĩa vụ xem xét giải quyết hồ sơ yêu cầu quyền lợi bảo hiểm trong thời hạn nào kể từ khi nhận được hồ sơ đầy đủ và hợp lệ?", "o": ["15 ngày", "21 ngày", "30 ngày", "60 ngày"], "e": "Prudential xem xét giải quyết trong 30 ngày kể từ khi nhận hồ sơ yêu cầu đầy đủ và hợp lệ.", "r": "Điều 6"}, "en": {"q": "Within what period must Prudential assess a claim after receiving complete and valid claim documents?", "o": ["15 days", "21 days", "30 days", "60 days"], "e": "Prudential assesses the claim within 30 days of receiving complete and valid claim documents.", "r": "Article 6"}}, {"id": 39, "a": 1, "vi": {"q": "Nếu Sự Kiện Bảo Hiểm xảy ra tại nước ngoài hoặc việc điều trị thực hiện tại nước ngoài, các chứng từ không được lập bằng Tiếng Việt hoặc Tiếng Anh phải được xử lý như thế nào?", "o": ["Không cần dịch", "Dịch công chứng sang Tiếng Việt theo quy định pháp luật", "Chỉ cần bản dịch không công chứng sang Tiếng Anh", "Chỉ cần Bên Mua Bảo Hiểm xác nhận nội dung"], "e": "Chứng từ lập ở nước ngoài không bằng Tiếng Việt hoặc Tiếng Anh phải được dịch công chứng sang Tiếng Việt theo quy định pháp luật.", "r": "Điều 7"}, "en": {"q": "If the Insured Event occurs abroad or treatment takes place abroad, how must documents not in Vietnamese or English be handled?", "o": ["No translation needed", "Notarised translation into Vietnamese in accordance with the law", "An unnotarised English translation is sufficient", "Confirmation of contents by the Policyowner is sufficient"], "e": "Documents issued abroad that are not in Vietnamese or English must have a notarised Vietnamese translation in accordance with the law.", "r": "Article 7"}}, {"id": 40, "a": 2, "vi": {"q": "Quyền lợi bảo hiểm được chi trả theo phương thức nào?", "o": ["Chỉ bằng tiền mặt", "Chỉ bằng ngoại tệ", "Bằng Đồng Việt Nam dưới hình thức chuyển khoản hoặc hình thức khác theo thỏa thuận giữa Prudential và Người Nhận Quyền Lợi Bảo Hiểm", "Bằng hiện vật có giá trị tương đương"], "e": "Quyền lợi được chi trả bằng Đồng Việt Nam dưới hình thức chuyển khoản hoặc hình thức khác theo thỏa thuận giữa Prudential và Người Nhận Quyền Lợi Bảo Hiểm.", "r": "Điều 8.2"}, "en": {"q": "How are insurance benefits paid?", "o": ["In cash only", "In foreign currency only", "In Vietnamese Dong by bank transfer or another method agreed between Prudential and the Claimant", "In kind of equivalent value"], "e": "Benefits are paid in Vietnamese Dong by bank transfer or another method agreed between Prudential and the Claimant.", "r": "Article 8.2"}}, {"id": 41, "a": 2, "vi": {"q": "Đối với Sản Phẩm Bảo Hiểm Chính, Thời Hạn Đóng Phí được quy định như thế nào?", "o": ["Luôn bằng 5 năm", "Bằng một nửa Thời Hạn Bảo Hiểm", "Bằng Thời Hạn Bảo Hiểm", "Không phụ thuộc Thời Hạn Bảo Hiểm"], "e": "Đối với Sản Phẩm Bảo Hiểm Chính, Thời Hạn Đóng Phí bằng Thời Hạn Bảo Hiểm.", "r": "Điều 11"}, "en": {"q": "For the basic product, how is the Premium Payment Term defined?", "o": ["Always 5 years", "Half of the Policy Term", "Equal to the Policy Term", "Independent of the Policy Term"], "e": "For the basic product, the Premium Payment Term equals the Policy Term.", "r": "Article 11"}}, {"id": 42, "a": 1, "vi": {"q": "Trong Thời Hạn Cân Nhắc, nếu Bên Mua Bảo Hiểm từ chối tiếp tục tham gia và Prudential chấp thuận bằng văn bản, khoản hoàn trả đối với Sản Phẩm Bảo Hiểm Chính được xác định như thế nào?", "o": ["Hoàn trả 50% phí đã đóng", "Hoàn trả tổng phí bảo hiểm đã đóng, không có lãi, sau khi trừ chi phí khám, xét nghiệm y khoa, nếu có", "Hoàn trả toàn bộ phí và cộng lãi", "Không hoàn trả phí"], "e": "Khi hủy trong Thời Hạn Cân Nhắc, Prudential hoàn tổng phí đã đóng của Sản Phẩm Bảo Hiểm Chính, không có lãi, sau khi trừ chi phí khám, xét nghiệm y khoa nếu có.", "r": "Điều 13.1"}, "en": {"q": "During the Free-look Period, if the Policyowner declines to continue and Prudential approves in writing, what is refunded for the basic product?", "o": ["50% of premiums paid", "Total premium paid, without interest, less medical examination costs, if any", "All premiums plus interest", "No refund"], "e": "On cancellation within the Free-look Period, Prudential refunds the total basic-product premium paid, without interest, less medical examination costs, if any.", "r": "Article 13.1"}}, {"id": 43, "a": 2, "vi": {"q": "Sau Thời Hạn Cân Nhắc, nếu Bên Mua Bảo Hiểm chấm dứt Hợp Đồng Bảo Hiểm trước hạn, Sản Phẩm Bảo Hiểm Chính có giá trị hoàn lại hoặc giá trị tiền mặt không?", "o": ["Có giá trị hoàn lại bằng 100% phí đã đóng", "Có giá trị tiền mặt từ Năm Hợp Đồng thứ 2", "Không có giá trị hoàn lại hoặc giá trị tiền mặt", "Có giá trị hoàn lại tùy theo Số Tiền Bảo Hiểm"], "e": "Sau Thời Hạn Cân Nhắc, sản phẩm không có giá trị hoàn lại hoặc giá trị tiền mặt khi Bên Mua Bảo Hiểm chấm dứt trước hạn.", "r": "Điều 13.3.3"}, "en": {"q": "After the Free-look Period, if the Policyowner terminates the Policy early, does the basic product have any surrender value or cash value?", "o": ["Yes – surrender value equal to 100% of premiums paid", "Yes – cash value from Policy Year 2", "No surrender value or cash value", "Surrender value depending on the Sum Assured"], "e": "After the Free-look Period, the product has no surrender value or cash value on early termination by the Policyowner.", "r": "Article 13.3.3"}}, {"id": 44, "a": 2, "vi": {"q": "Việc chuyển giao Hợp Đồng Bảo Hiểm chỉ có hiệu lực khi nào?", "o": ["Khi Bên Mua Bảo Hiểm ký yêu cầu chuyển giao", "Khi Người Nhận Chuyển Giao đóng kỳ phí tiếp theo", "Khi Prudential có văn bản xác nhận việc chuyển giao", "Khi Người Được Bảo Hiểm đồng ý bằng lời nói"], "e": "Việc chuyển giao chỉ có hiệu lực khi Prudential có văn bản xác nhận.", "r": "Điều 13.3.4"}, "en": {"q": "When does an assignment of the Policy take effect?", "o": ["When the Policyowner signs the assignment request", "When the Assignee pays the next premium", "When Prudential confirms the assignment in writing", "When the Life Assured agrees verbally"], "e": "An assignment takes effect only when confirmed by Prudential in writing.", "r": "Article 13.3.4"}}, {"id": 45, "a": 1, "vi": {"q": "Sau khi việc chuyển giao Hợp Đồng Bảo Hiểm có hiệu lực, điều gì xảy ra với những Người Thụ Hưởng do Bên Mua Bảo Hiểm ban đầu chỉ định?", "o": ["Tiếp tục giữ nguyên", "Tự động bị hủy bỏ", "Trở thành Bên Mua Bảo Hiểm", "Chỉ bị hủy khi Người Được Bảo Hiểm có yêu cầu riêng"], "e": "Khi chuyển giao có hiệu lực, Người Thụ Hưởng do Bên Mua Bảo Hiểm ban đầu chỉ định tự động bị hủy bỏ.", "r": "Điều 13.3.4"}, "en": {"q": "After an assignment takes effect, what happens to the Beneficiaries designated by the original Policyowner?", "o": ["They remain unchanged", "They are automatically revoked", "They become the Policyowner", "They are revoked only at the Life Assured's separate request"], "e": "Once the assignment takes effect, Beneficiaries designated by the original Policyowner are automatically revoked.", "r": "Article 13.3.4"}}, {"id": 46, "a": 1, "vi": {"q": "Việc chỉ định hoặc thay đổi Người Thụ Hưởng có hiệu lực khi nào?", "o": ["Ngay khi Bên Mua Bảo Hiểm thông báo bằng điện thoại", "Khi có sự đồng ý bằng văn bản của Người Được Bảo Hiểm và được Prudential chấp thuận bằng văn bản", "Ngay khi Người Thụ Hưởng ký nhận", "Tự động có hiệu lực sau 30 ngày"], "e": "Việc chỉ định hoặc thay đổi Người Thụ Hưởng cần sự đồng ý bằng văn bản của Người Được Bảo Hiểm và chỉ có hiệu lực khi Prudential chấp thuận bằng văn bản.", "r": "Điều 13.3.5"}, "en": {"q": "When does a nomination or change of Beneficiary take effect?", "o": ["As soon as the Policyowner notifies by phone", "With the written consent of the Life Assured and Prudential's written approval", "As soon as the Beneficiary signs", "Automatically after 30 days"], "e": "Nomination or change of Beneficiary requires the Life Assured's written consent and takes effect only upon Prudential's written approval.", "r": "Article 13.3.5"}}, {"id": 47, "a": 1, "vi": {"q": "Nếu Bên Mua Bảo Hiểm và/hoặc Người Được Bảo Hiểm cố ý kê khai không đầy đủ, không chính xác hoặc không trung thực thông tin cần thiết, và nếu có thông tin chính xác Prudential sẽ không chấp nhận bảo hiểm, Prudential có quyền xử lý như thế nào?", "o": ["Chỉ tăng Phí Bảo Hiểm", "Hủy bỏ Hợp Đồng Bảo Hiểm; hợp đồng không có hiệu lực kể từ Ngày Hiệu Lực Hợp Đồng và phí được hoàn lại sau các khoản khấu trừ theo quy định", "Vẫn phải chi trả đầy đủ mọi quyền lợi", "Chỉ nhắc nhở và giữ nguyên hợp đồng"], "e": "Nếu cố ý kê khai không đầy đủ, không chính xác hoặc không trung thực và thông tin đúng sẽ dẫn đến từ chối bảo hiểm, Prudential có quyền hủy hợp đồng; hợp đồng không có hiệu lực từ Ngày Hiệu Lực Hợp Đồng.", "r": "Điều 14.1.2"}, "en": {"q": "If the Policyowner and/or Life Assured intentionally provide incomplete, inaccurate or untrue material information, and Prudential would not have accepted the risk had it known the truth, what may Prudential do?", "o": ["Only increase the premium", "Rescind the Policy; the Policy is void from the Policy Effective Date and premiums are refunded after the deductions set out in the rules", "Still pay all benefits in full", "Only issue a reminder and keep the Policy"], "e": "In case of intentional non-disclosure or misrepresentation where the truth would have led to declinature, Prudential may rescind the Policy; the Policy is void from the Policy Effective Date.", "r": "Article 14.1.2"}}, {"id": 48, "a": 2, "vi": {"q": "Khi Người Được Bảo Hiểm ra khỏi lãnh thổ Việt Nam trong thời gian bao lâu liên tục, Bên Mua Bảo Hiểm cần thông báo cho Prudential trong thời gian sớm nhất?", "o": ["Từ 30 ngày trở lên", "Từ 60 ngày trở lên", "Từ 90 ngày trở lên", "Từ 180 ngày trở lên"], "e": "Nếu Người Được Bảo Hiểm ra khỏi Việt Nam từ 90 ngày liên tục trở lên, Bên Mua Bảo Hiểm cần thông báo cho Prudential trong thời gian sớm nhất.", "r": "Điều 14.4(ii)"}, "en": {"q": "If the Life Assured is outside Vietnam continuously for how long must the Policyowner notify Prudential as soon as possible?", "o": ["30 days or more", "60 days or more", "90 days or more", "180 days or more"], "e": "If the Life Assured is outside Vietnam for 90 consecutive days or more, the Policyowner should notify Prudential as soon as possible.", "r": "Article 14.4(ii)"}}, {"id": 49, "a": 2, "vi": {"q": "Khi Người Được Bảo Hiểm còn sống, Prudential miễn truy xét đối với nội dung kê khai không chính xác hoặc bỏ sót sau thời hạn nào, trừ trường hợp cố ý kê khai không trung thực theo quy định?", "o": ["12 tháng kể từ Ngày Hiệu Lực Hợp Đồng", "18 tháng kể từ Ngày Hiệu Lực Hợp Đồng", "24 tháng kể từ Ngày Hiệu Lực Hợp Đồng, ngày khôi phục hiệu lực gần nhất hoặc ngày chấp thuận tăng Số Tiền Bảo Hiểm gần nhất, tùy ngày nào đến sau", "36 tháng kể từ ngày đóng kỳ phí đầu tiên"], "e": "Miễn truy xét sau 24 tháng kể từ Ngày Hiệu Lực Hợp Đồng, ngày khôi phục gần nhất hoặc ngày chấp thuận tăng Số Tiền Bảo Hiểm gần nhất, tùy ngày nào đến sau; không áp dụng với cố ý kê khai không trung thực theo quy định.", "r": "Điều 21"}, "en": {"q": "While the Life Assured is alive, after what period does Prudential waive its right to contest inaccurate or omitted disclosures, except for intentional misrepresentation as stipulated?", "o": ["12 months from the Policy Effective Date", "18 months from the Policy Effective Date", "24 months from the Policy Effective Date, the latest reinstatement date or the latest Sum Assured increase approval date, whichever is later", "36 months from payment of the first premium"], "e": "Incontestability applies after 24 months from the Policy Effective Date, the latest reinstatement date or the latest Sum Assured increase approval date, whichever is later; it does not apply to intentional misrepresentation as stipulated.", "r": "Article 21"}}, {"id": 50, "a": 1, "vi": {"q": "Nếu tranh chấp liên quan đến Hợp Đồng Bảo Hiểm không giải quyết được bằng thương lượng giữa các bên, tranh chấp sẽ được xử lý như thế nào?", "o": ["Tự động hủy Hợp Đồng Bảo Hiểm", "Đưa ra tòa án có thẩm quyền để giải quyết theo quy định pháp luật", "Chỉ giải quyết nội bộ tại Prudential", "Người Thụ Hưởng tự quyết định kết quả"], "e": "Nếu không giải quyết được bằng thương lượng, tranh chấp được đưa ra tòa án có thẩm quyền theo quy định pháp luật.", "r": "Điều 23"}, "en": {"q": "If a dispute relating to the Policy cannot be settled by negotiation, how will it be resolved?", "o": ["The Policy is automatically cancelled", "It is brought to a competent court in accordance with the law", "It is resolved internally at Prudential only", "The Beneficiary decides the outcome"], "e": "If not resolved through negotiation, the dispute is brought to a competent court in accordance with the law.", "r": "Article 23"}}]}, {"id": "pklh", "cat": "rider", "name": "PRUKhỏe Linh Hoạt", "type": {"vi": "Bảo hiểm sức khỏe", "en": "Health Insurance"}, "ic": "heart", "groups": [["elig", [1, 5, 8]], ["benefit", [2, 3, 4, 6, 7, 12, 13, 14, 15]], ["copay", [9, 10, 11]], ["wait", [16, 17, 18]], ["ops", [19, 20]]], "qs": [{"id": 1, "a": 2, "vi": {"q": "Anh Hùng muốn tham gia PRUKhỏe Linh Hoạt cho con gái 2 tháng tuổi và mẹ ruột 68 tuổi. Theo điều kiện về tuổi tham gia, ai có thể là Người Được Bảo Hiểm?", "o": ["Chỉ con gái 2 tháng tuổi", "Chỉ mẹ ruột 68 tuổi", "Cả con gái và mẹ ruột", "Không ai đủ điều kiện"], "e": "Điều 6: NĐBH phải từ 30 ngày tuổi đến 70 tuổi khi tham gia. Bé 2 tháng tuổi và mẹ 68 tuổi đều trong độ tuổi này. Điều 7: bảo vệ tái tục hằng năm, tối đa đến Ngày Kỷ Niệm HĐ ngay sau sinh nhật 100 tuổi của NĐBH (hoặc đến khi HĐ chính kết thúc, tùy thời điểm nào đến trước).", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Mr. Hùng wants to buy PRUKhỏe Linh Hoạt for his 2-month-old daughter and his 68-year-old mother. Based on the entry age requirement, who can be the Life Assured?", "o": ["Only the 2-month-old daughter", "Only the 68-year-old mother", "Both the daughter and the mother", "Neither is eligible"], "e": "Article 6: The Life Assured must be from 30 days to 70 years old at entry. Both the 2-month-old baby and the 68-year-old mother fall within this range. Article 7: cover is renewable annually, up to the Policy Anniversary immediately following the Life Assured's 100th birthday (or until the basic policy ends, whichever comes first).", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 2, "a": 1, "vi": {"q": "Chị Hoa chọn Hạn Mức Hàng Năm của Quyền Lợi Nội Trú là 800 triệu đồng. Khi cần Điều Trị Nội Trú, chị được bảo vệ trong Phạm Vi Địa Lý nào?", "o": ["Việt Nam", "Châu Á", "Toàn Cầu", "Đông Nam Á"], "e": "Bảng 1 (Điều 1.4): Hạn mức 100–500 triệu → Việt Nam; 600 triệu – 2 tỷ → Châu Á; 3 tỷ, 5 tỷ → Toàn Cầu. 800 triệu thuộc nhóm Châu Á. Định nghĩa 39: Châu Á gồm 14 quốc gia/vùng lãnh thổ được liệt kê; không bao gồm các nước thuộc danh sách cấm vận.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Ms. Hoa chooses an Inpatient Benefit Annual Limit of VND 800 million. When she needs Inpatient Treatment, what is her Geographical Coverage?", "o": ["Vietnam", "Asia", "Worldwide", "Southeast Asia"], "e": "Table 1 (Article 1.4): Limits of VND 100–500 million → Vietnam; VND 600 million – 2 billion → Asia; VND 3 billion and 5 billion → Worldwide. VND 800 million falls under Asia. Definition 39: Asia covers the 14 listed countries/territories, excluding countries on the sanctions list.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 3, "a": 3, "vi": {"q": "Khách hàng muốn Quyền Lợi Nội Trú được bảo vệ trên phạm vi Toàn Cầu. Khách hàng cần chọn Hạn Mức Hàng Năm nào?", "o": ["2 tỷ đồng", "1 tỷ đồng", "Bất kỳ mức nào, chỉ cần đóng thêm phí", "3 tỷ hoặc 5 tỷ đồng"], "e": "Bảng 1 (Điều 1.4): Chỉ Hạn Mức Hàng Năm 3 tỷ hoặc 5 tỷ đồng mới có Phạm Vi Địa Lý Toàn Cầu. Phạm Vi Địa Lý được xác định theo Hạn Mức Hàng Năm đã chọn (Định nghĩa 39), không phụ thuộc mức phí đóng thêm.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "A customer wants Worldwide Geographical Coverage for the Inpatient Benefit. Which Annual Limit must the customer choose?", "o": ["VND 2 billion", "VND 1 billion", "Any level, as long as additional premium is paid", "VND 3 billion or VND 5 billion"], "e": "Table 1 (Article 1.4): Only an Annual Limit of VND 3 billion or 5 billion provides Worldwide coverage. Geographical Coverage is determined by the chosen Annual Limit (Definition 39), not by paying additional premium.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 4, "a": 2, "vi": {"q": "Anh Tuấn chọn Quyền Lợi Nội Trú 5 tỷ đồng và Quyền Lợi Ngoại Trú lựa chọn 3 (6%). Hạn Mức Hàng Năm của Quyền Lợi Ngoại Trú của anh là bao nhiêu?", "o": ["300 triệu đồng", "200 triệu đồng", "150 triệu đồng", "100 triệu đồng"], "e": "Bảng 2 (Điều 1.5): Ngoại Trú có 3 lựa chọn 2% / 4% / 6% hạn mức Nội Trú, tối đa 150 triệu đồng. 6% x 5 tỷ = 300 triệu, vượt trần nên chỉ được 150 triệu đồng.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Mr. Tuấn chooses an Inpatient Benefit of VND 5 billion and Outpatient Benefit option 3 (6%). What is his Outpatient Benefit Annual Limit?", "o": ["VND 300 million", "VND 200 million", "VND 150 million", "VND 100 million"], "e": "Table 2 (Article 1.5): The Outpatient Benefit has 3 options – 2% / 4% / 6% of the Inpatient limit, capped at VND 150 million. 6% x VND 5 billion = VND 300 million, which exceeds the cap, so the limit is VND 150 million.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 5, "a": 0, "vi": {"q": "Khách hàng muốn chỉ tham gia Quyền Lợi Nội Trú và Quyền Lợi Nha Khoa, không tham gia Quyền Lợi Ngoại Trú. Lựa chọn này có hợp lệ không?", "o": ["Không hợp lệ, Quyền Lợi Nha Khoa chỉ được tham gia khi có Quyền Lợi Ngoại Trú", "Hợp lệ nếu Hạn Mức Hàng Năm từ 1 tỷ trở lên", "Hợp lệ nếu chọn tỷ lệ Đồng Chi Trả 20%", "Hợp lệ, không có điều kiện"], "e": "Điều 1.2: Có 5 Chương Trình Bảo Hiểm, Nội Trú là quyền lợi cơ bản; không có chương trình \"Nội Trú + Nha Khoa\". Điều 1.6 và 1.7: Nha Khoa và Thai Sản chỉ được chọn khi có tham gia Ngoại Trú.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "A customer wants only the Inpatient Benefit and the Dental Benefit, without the Outpatient Benefit. Is this selection valid?", "o": ["Not valid – the Dental Benefit can only be selected together with the Outpatient Benefit", "Valid if the Annual Limit is VND 1 billion or more", "Valid if a 20% Co-payment is chosen", "Valid, with no conditions"], "e": "Article 1.2: There are 5 Coverage Plans with Inpatient as the core benefit; there is no \"Inpatient + Dental\" plan. Articles 1.6 and 1.7: Dental and Maternity can only be selected when the Outpatient Benefit is included.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 6, "a": 1, "vi": {"q": "Chị Lan chọn Quyền Lợi Nội Trú 1 tỷ đồng, Quyền Lợi Ngoại Trú lựa chọn 2 (4%) và tham gia thêm Quyền Lợi Nha Khoa. Hạn Mức Hàng Năm của Quyền Lợi Nha Khoa là bao nhiêu?", "o": ["10 triệu đồng", "15 triệu đồng", "20 triệu đồng", "30 triệu đồng"], "e": "Bảng 3 (Điều 1.6): Hạn mức Nha Khoa đi theo lựa chọn Ngoại Trú: lựa chọn 1 → 1%, lựa chọn 2 → 1,5%, lựa chọn 3 → 2% hạn mức Nội Trú, tối đa 30 triệu. Lựa chọn 2: 1,5% x 1 tỷ = 15 triệu đồng.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Ms. Lan chooses an Inpatient Benefit of VND 1 billion, Outpatient Benefit option 2 (4%) and adds the Dental Benefit. What is her Dental Benefit Annual Limit?", "o": ["VND 10 million", "VND 15 million", "VND 20 million", "VND 30 million"], "e": "Table 3 (Article 1.6): The Dental limit follows the Outpatient option: option 1 → 1%, option 2 → 1.5%, option 3 → 2% of the Inpatient limit, capped at VND 30 million. Option 2: 1.5% x VND 1 billion = VND 15 million.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 7, "a": 3, "vi": {"q": "Chị Mai 32 tuổi chọn Quyền Lợi Nội Trú 2 tỷ đồng, có Quyền Lợi Ngoại Trú và Quyền Lợi Thai Sản. Hạn Mức Hàng Năm của Quyền Lợi Thai Sản là bao nhiêu?", "o": ["200 triệu đồng", "100 triệu đồng", "120 triệu đồng", "160 triệu đồng"], "e": "Bảng 4 (Điều 1.7): Hạn mức Thai Sản = 8% hạn mức Nội Trú, tối đa 200 triệu đồng. 8% x 2 tỷ = 160 triệu, chưa vượt trần nên được 160 triệu đồng.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Ms. Mai, aged 32, chooses an Inpatient Benefit of VND 2 billion with the Outpatient and Maternity Benefits. What is her Maternity Benefit Annual Limit?", "o": ["VND 200 million", "VND 100 million", "VND 120 million", "VND 160 million"], "e": "Table 4 (Article 1.7): Maternity limit = 8% of the Inpatient limit, capped at VND 200 million. 8% x VND 2 billion = VND 160 million, below the cap, so the limit is VND 160 million.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 8, "a": 0, "vi": {"q": "Phát biểu nào ĐÚNG về điều kiện áp dụng Quyền Lợi Thai Sản?", "o": ["NĐBH là nữ từ 18 đến 50 tuổi; tuổi khi tham gia quyền lợi này không quá 45", "NĐBH là nữ từ 18 đến 45 tuổi; tuổi khi tham gia không quá 40", "Áp dụng cho mọi NĐBH nữ, không giới hạn tuổi", "Áp dụng Phạm Vi Toàn Cầu nếu Nội Trú từ 3 tỷ"], "e": "Điều 1.7: Thai Sản áp dụng cho NĐBH nữ từ 18 đến 50 tuổi, tuổi khi tham gia quyền lợi này không quá 45; chi trả 1 kỳ thai sản mỗi Năm Hợp Đồng. Bảng 4: Phạm Vi Địa Lý chỉ là Việt Nam, kể cả khi Nội Trú chọn Toàn Cầu.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Which statement about the eligibility for the Maternity Benefit is CORRECT?", "o": ["Female Life Assured aged 18 to 50; entry age for this benefit not over 45", "Female Life Assured aged 18 to 45; entry age not over 40", "Applies to all female Life Assured with no age limit", "Worldwide coverage applies if the Inpatient limit is VND 3 billion or more"], "e": "Article 1.7: Maternity applies to female Life Assured aged 18 to 50, with entry age for this benefit not over 45; one pregnancy is covered per Policy Year. Table 4: Geographical Coverage is Vietnam only, even if Inpatient coverage is Worldwide.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 9, "a": 2, "vi": {"q": "Anh Long 40 tuổi chọn tỷ lệ Đồng Chi Trả 20% cho Quyền Lợi Nội Trú. Anh nằm viện điều trị tại Bệnh Viện Công. Tỷ lệ Đồng Chi Trả có được áp dụng không?", "o": ["Có, áp dụng 20%", "Có, áp dụng 10%", "Không áp dụng, vì Đồng Chi Trả chỉ áp dụng tại Bệnh Viện Tư/Phòng Khám Tư", "Chỉ áp dụng khi chi phí trên 50 triệu đồng"], "e": "Định nghĩa 31 và Điều 1.3: Đồng Chi Trả (nếu có) chỉ áp dụng khi NĐBH điều trị tại Bệnh Viện Tư hoặc Phòng Khám Tư. Điều trị tại Bệnh Viện Công thì không áp dụng.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Mr. Long, aged 40, chooses a 20% Co-payment for the Inpatient Benefit. He is treated as an inpatient at a Public Hospital. Does the Co-payment apply?", "o": ["Yes, 20% applies", "Yes, 10% applies", "No – Co-payment only applies at Private Hospitals/Private Clinics", "Only when costs exceed VND 50 million"], "e": "Definition 31 and Article 1.3: Co-payment (if any) only applies when the Life Assured is treated at a Private Hospital or Private Clinic. It does not apply to treatment at a Public Hospital.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 10, "a": 3, "vi": {"q": "Bé Na 4 tuổi tham gia PRUKhỏe Linh Hoạt. Tỷ lệ Đồng Chi Trả của Quyền Lợi Nội Trú (khi điều trị tại cơ sở tư) của bé là bao nhiêu?", "o": ["0%", "0% hoặc 20% tùy BMBH lựa chọn", "10%", "20%"], "e": "Điều 1.3 (Quyền Lợi Nội Trú): Từ 30 ngày tuổi đến dưới 6 tuổi → 20%; từ 6 đến 75 tuổi → BMBH chọn 0% hoặc 20%; từ 76 đến 100 tuổi → 20%. Bé 4 tuổi áp dụng 20% (Prudential chi trả 80%).", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Na, aged 4, is covered under PRUKhỏe Linh Hoạt. What is her Inpatient Benefit Co-payment rate (for treatment at a private facility)?", "o": ["0%", "0% or 20%, as chosen by the Policyowner", "10%", "20%"], "e": "Article 1.3 (Inpatient Benefit): 30 days to under 6 years old → 20%; ages 6 to 75 → Policyowner chooses 0% or 20%; ages 76 to 100 → 20%. At age 4, the rate is 20% (Prudential pays 80%).", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 11, "a": 1, "vi": {"q": "Với NĐBH từ 6 đến 75 tuổi, BMBH được thay đổi tỷ lệ Đồng Chi Trả của Quyền Lợi Nội Trú bao nhiêu lần?", "o": ["Không được thay đổi", "1 lần duy nhất trong suốt thời gian Bảo Hiểm có hiệu lực", "2 lần", "Mỗi Năm Hợp Đồng 1 lần"], "e": "Điều 1.9.2: Với NĐBH từ 6 đến 75 tuổi, BMBH được thay đổi tỷ lệ Đồng Chi Trả của Quyền Lợi Nội Trú 1 lần duy nhất trong suốt thời hạn Bảo Hiểm. Yêu cầu gửi trong vòng 30 ngày trước Ngày Kỷ Niệm Năm Hợp Đồng tiếp theo, có hiệu lực từ ngày kỷ niệm đó nếu được chấp thuận (Điều 1.9). Dễ nhầm: \"mỗi Năm Hợp Đồng 1 lần\" là quy định thay đổi Quyền Lợi Bảo Hiểm (Điều 1.9.1).", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "For a Life Assured aged 6 to 75, how many times may the Policyowner change the Inpatient Benefit Co-payment rate?", "o": ["No changes allowed", "Only once while the cover is in force", "Twice", "Once every Policy Year"], "e": "Article 1.9.2: For a Life Assured aged 6 to 75, the Policyowner may change the Inpatient Co-payment rate only once during the cover. The request must be submitted within 30 days before the next Policy Anniversary and, if approved, takes effect from that anniversary (Article 1.9). Common confusion: \"once every Policy Year\" is the rule for changing Insurance Benefits (Article 1.9.1).", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 12, "a": 0, "vi": {"q": "Hạn Mức Hàng Năm Quyền Lợi Nội Trú của anh Phát đã được chi trả hết. Quyền Lợi Nhân Đôi Hạn Mức được áp dụng như thế nào?", "o": ["Cộng thêm tối đa 100% Hạn Mức Hàng Năm khi Điều Trị Nội Trú tại Bệnh Viện Công, 1 lần cho Đợt Nằm Viện tiếp theo trong Năm Hợp Đồng", "Áp dụng khi điều trị tại bất kỳ bệnh viện nào", "Áp dụng khi BMBH đóng thêm phí bảo hiểm", "Áp dụng cho mọi đợt nằm viện còn lại và cộng dồn sang năm sau"], "e": "Bảng 1 (Quyền Lợi Nhân Đôi Hạn Mức): Khi hạn mức Nội Trú đã chi trả hết, NĐBH được thêm tối đa 100% hạn mức nếu nằm viện tại Bệnh Viện Công. Tự động kích hoạt, không tăng phí, áp dụng 1 lần cho 1 Đợt Nằm Viện tiếp theo trong Năm Hợp Đồng, không cộng dồn sang năm sau; các Giới Hạn Phụ Mục A được áp dụng lại từ đầu.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Mr. Phát's Inpatient Benefit Annual Limit has been fully used. How does the Double Limit Benefit apply?", "o": ["Adds up to 100% of the Annual Limit for Inpatient Treatment at a Public Hospital, once for the next Hospitalisation in the Policy Year", "Applies to treatment at any hospital", "Applies when the Policyowner pays additional premium", "Applies to all remaining hospitalisations and carries over to the next year"], "e": "Table 1 (Double Limit Benefit): Once the Inpatient limit is exhausted, the Life Assured receives up to an additional 100% of the limit if hospitalised at a Public Hospital. It is activated automatically at no extra premium, applies once for the next Hospitalisation in the Policy Year and does not carry over; the Section A sub-limits apply afresh.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 13, "a": 1, "vi": {"q": "Hạn Mức Hàng Năm Quyền Lợi Nội Trú là 600 triệu đồng. Với một Đợt Nằm Viện không có Phẫu Thuật (không liên quan điều trị bệnh hiểm nghèo), Prudential chi trả tối đa bao nhiêu?", "o": ["600 triệu đồng", "300 triệu đồng", "180 triệu đồng", "120 triệu đồng"], "e": "Bảng 1, Mục A.1: Giới Hạn Phụ cho 1 Đợt Nằm Viện không có Phẫu Thuật = 50% Hạn Mức Hàng Năm Nội Trú. 50% x 600 triệu = 300 triệu đồng. (Nằm viện có Phẫu Thuật: chi trả theo Chi Phí Y Tế thực tế.)", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "The Inpatient Benefit Annual Limit is VND 600 million. For a Hospitalisation without Surgery (not related to critical illness treatment), what is the maximum Prudential pays?", "o": ["VND 600 million", "VND 300 million", "VND 180 million", "VND 120 million"], "e": "Table 1, Section A.1: Sub-limit for one Hospitalisation without Surgery = 50% of the Inpatient Annual Limit. 50% x VND 600 million = VND 300 million. (Hospitalisation with Surgery: paid based on actual Medical Expenses.)", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 14, "a": 3, "vi": {"q": "Hạn Mức Hàng Năm Quyền Lợi Nội Trú là 1 tỷ đồng. Chi Phí Giường và Phòng được chi trả tối đa như thế nào?", "o": ["10 triệu đồng/ngày, tối đa 30 ngày/Năm Hợp Đồng", "6 triệu đồng/ngày, không giới hạn số ngày", "3 triệu đồng/ngày, tối đa 60 ngày/Năm Hợp Đồng", "6 triệu đồng/ngày, tối đa 100 ngày/Năm Hợp Đồng"], "e": "Bảng 1, Mục A.3.1: Chi Phí Giường Và Phòng = 0,6% Hạn Mức Hàng Năm/ngày, tối đa 100 ngày/Năm Hợp Đồng. 0,6% x 1 tỷ = 6 triệu đồng/ngày. Định nghĩa 15: tại Bệnh Viện Tư, chi trả theo phòng đơn tiêu chuẩn giá thấp nhất.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "The Inpatient Benefit Annual Limit is VND 1 billion. What is the maximum payable for Room and Board?", "o": ["VND 10 million/day, up to 30 days/Policy Year", "VND 6 million/day, with no limit on days", "VND 3 million/day, up to 60 days/Policy Year", "VND 6 million/day, up to 100 days/Policy Year"], "e": "Table 1, Section A.3.1: Room and Board = 0.6% of the Annual Limit per day, up to 100 days per Policy Year. 0.6% x VND 1 billion = VND 6 million/day. Definition 15: at a Private Hospital, payment is based on the lowest-priced standard single room.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 15, "a": 2, "vi": {"q": "Hạn Mức Hàng Năm Quyền Lợi Nội Trú là 1 tỷ đồng. NĐBH Điều Trị Nội Trú tại Bệnh Viện Công ở Việt Nam 8 ngày. Phụ Cấp Nằm Viện Tại Bệnh Viện Công tối đa là bao nhiêu?", "o": ["8 triệu đồng", "16 triệu đồng", "5 triệu đồng", "Không được chi trả"], "e": "Bảng 1, Mục A.3.2: Phụ cấp 0,1% hạn mức/ngày (tối đa 2 triệu/ngày), áp dụng khi nằm viện tại Bệnh Viện Công ở Việt Nam từ 3 ngày trở lên, tối đa 5 ngày/Đợt Nằm Viện, 30 ngày/Năm Hợp Đồng. 0,1% x 1 tỷ = 1 triệu/ngày x 5 ngày = 5 triệu đồng. Định nghĩa 47: điều kiện là có Chi Phí Y Tế được chấp thuận trong đợt nằm viện; tổng Phụ cấp + Chi Phí Giường Và Phòng không vượt Giới Hạn Phụ của Giường Và Phòng.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "The Inpatient Benefit Annual Limit is VND 1 billion. The Life Assured receives Inpatient Treatment at a Public Hospital in Vietnam for 8 days. What is the maximum Public Hospital Daily Cash Allowance?", "o": ["VND 8 million", "VND 16 million", "VND 5 million", "Not payable"], "e": "Table 1, Section A.3.2: Allowance of 0.1% of the limit per day (max VND 2 million/day), applicable for hospitalisation at a Public Hospital in Vietnam of 3 days or more, up to 5 days per Hospitalisation and 30 days per Policy Year. 0.1% x VND 1 billion = VND 1 million/day x 5 days = VND 5 million. Definition 47: approved Medical Expenses must be incurred during the hospitalisation; the Allowance plus Room and Board must not exceed the Room and Board sub-limit.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 16, "a": 0, "vi": {"q": "Chị Thảo tham gia PRUKhỏe Linh Hoạt, ngày hiệu lực 01/03. Ngày 20/05, chị được chẩn đoán ung thư và cần điều trị nội trú. Trường hợp này thế nào?", "o": ["Chưa được chi trả, vì còn trong Thời Gian Chờ 90 ngày", "Được xem xét chi trả, vì đã qua 30 ngày", "Được chi trả 50% chi phí", "Không áp dụng Thời Gian Chờ cho ung thư"], "e": "Điều 1.8: Thời Gian Chờ cho Điều Trị Ung Thư, Bệnh Đặc Biệt, Cấy Ghép Nội Tạng là 90 ngày, tính từ Ngày Hiệu Lực (hoặc Ngày Khôi Phục Hiệu Lực gần nhất) – Định nghĩa 54. Từ 01/03 đến 20/05 mới 80 ngày nên chưa hết Thời Gian Chờ.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Ms. Thảo's PRUKhỏe Linh Hoạt cover starts on 1 March. On 20 May, she is diagnosed with cancer and needs inpatient treatment. What happens?", "o": ["Not yet payable, as she is still within the 90-day Waiting Period", "Eligible for assessment, as 30 days have passed", "50% of costs are paid", "No Waiting Period applies to cancer"], "e": "Article 1.8: The Waiting Period for Cancer Treatment, Special Diseases and Organ Transplant is 90 days from the Effective Date (or the latest Reinstatement Date) – Definition 54. From 1 March to 20 May is only 80 days, so the Waiting Period has not ended.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 17, "a": 1, "vi": {"q": "Anh Minh tham gia được 5 ngày thì bị tai nạn giao thông và phải nhập viện điều trị. Trường hợp này thế nào?", "o": ["Chưa được chi trả, phải chờ 30 ngày", "Được xem xét chi trả, vì điều trị do Tai Nạn không áp dụng Thời Gian Chờ", "Chưa được chi trả, phải chờ 90 ngày", "Chỉ chi trả chi phí ngoại trú"], "e": "Điều 1.8: Điều trị do Tai Nạn không áp dụng Thời Gian Chờ. Thời Gian Chờ khác: Ung thư/Bệnh Đặc Biệt/Cấy Ghép Nội Tạng 90 ngày; Thai Sản, Biến Chứng Thai Sản 270 ngày; các Bệnh khác 30 ngày.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Mr. Minh is in a traffic accident 5 days after his cover starts and is hospitalised. What happens?", "o": ["Not yet payable – must wait 30 days", "Eligible for assessment, as no Waiting Period applies to treatment due to Accident", "Not yet payable – must wait 90 days", "Only outpatient costs are paid"], "e": "Article 1.8: No Waiting Period applies to treatment due to Accident. Other Waiting Periods: Cancer/Special Diseases/Organ Transplant 90 days; Maternity and Pregnancy Complications 270 days; other Illnesses 30 days.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 18, "a": 3, "vi": {"q": "Trường hợp nào dưới đây KHÔNG thuộc điều khoản loại trừ của PRUKhỏe Linh Hoạt?", "o": ["Bệnh Có Sẵn chưa được kê khai", "Phẫu thuật thẩm mỹ không do Tai Nạn", "Điều trị nha khoa không do Tai Nạn khi không có Quyền Lợi Nha Khoa", "Bệnh Có Sẵn đã được kê khai và được Prudential chấp thuận"], "e": "Điều 2: (1) Bệnh Có Sẵn bị loại trừ, trừ trường hợp đã kê khai và được Prudential chấp thuận → đáp án D. (8) Điều trị/phẫu thuật thẩm mỹ bị loại trừ; phẫu thuật tạo hình chỉ được chi trả khi khôi phục chức năng do Thương Tích Tai Nạn hoặc Tái Tạo Tuyến Vú Sau Đoạn Nhũ. (10) Nha khoa không do Tai Nạn bị loại trừ, trừ khi có Quyền Lợi Nha Khoa. → TVV hướng dẫn KH kê khai trung thực.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Which of the following is NOT an exclusion under PRUKhỏe Linh Hoạt?", "o": ["An undisclosed Pre-existing Condition", "Cosmetic surgery not due to Accident", "Dental treatment not due to Accident without the Dental Benefit", "A Pre-existing Condition that was disclosed and accepted by Prudential"], "e": "Article 2: (1) Pre-existing Conditions are excluded unless disclosed and accepted by Prudential → answer D. (8) Cosmetic treatment/surgery is excluded; reconstructive surgery is only covered to restore function after Accidental Injury or for Breast Reconstruction After Mastectomy. (10) Dental treatment not due to Accident is excluded unless the Dental Benefit is included. → Agents should guide customers to disclose honestly.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 19, "a": 0, "vi": {"q": "Chị Thu xuất viện sau đợt Điều Trị Nội Trú. Phát biểu nào ĐÚNG về giải quyết Quyền Lợi Bảo Hiểm?", "o": ["Gửi yêu cầu trong vòng 1 năm kể từ ngày xuất viện; Prudential giải quyết trong 30 ngày kể từ khi nhận đủ hồ sơ hợp lệ", "Gửi yêu cầu trong 6 tháng; Prudential giải quyết trong 15 ngày", "Gửi yêu cầu trong 3 tháng; Prudential giải quyết trong 30 ngày", "Gửi yêu cầu trong 1 năm; Prudential giải quyết trong 60 ngày"], "e": "Điều 3.6: Thời hạn yêu cầu là 1 năm kể từ ngày xuất viện (Nội Trú) hoặc ngày bắt đầu điều trị (Ngoại Trú/Nha Khoa/Thai Sản). Prudential giải quyết trong 30 ngày kể từ ngày nhận đủ hồ sơ đầy đủ, hợp lệ.", "r": "T&C PRUKhỏe Linh Hoạt"}, "en": {"q": "Ms. Thu is discharged after Inpatient Treatment. Which statement about claims settlement is CORRECT?", "o": ["Submit the claim within 1 year from discharge; Prudential settles within 30 days of receiving complete, valid documents", "Submit within 6 months; Prudential settles within 15 days", "Submit within 3 months; Prudential settles within 30 days", "Submit within 1 year; Prudential settles within 60 days"], "e": "Article 3.6: The claim must be submitted within 1 year from the discharge date (Inpatient) or the treatment start date (Outpatient/Dental/Maternity). Prudential settles within 30 days of receiving complete and valid documents.", "r": "PRUKhỏe Linh Hoạt T&C"}}, {"id": 20, "a": 2, "vi": {"q": "Đến hạn đóng phí nhưng khách hàng chưa đóng. Thời hạn gia hạn đóng phí của sản phẩm bảo hiểm bán cùng là bao lâu?", "o": ["30 ngày", "90 ngày", "60 ngày kể từ ngày đến hạn đóng phí", "Không có thời hạn gia hạn"], "e": "Điều 8.2: Nếu phí không được đóng đủ khi đến hạn, BMBH được gia hạn 60 ngày tính từ ngày đến hạn đóng phí. Trong thời gian gia hạn, Bảo Hiểm Bán Cùng vẫn có hiệu lực; nếu Sự Kiện Bảo Hiểm xảy ra và được chấp thuận chi trả, quyền lợi được chi trả sau khi khấu trừ phí quá hạn và các khoản nợ (nếu có). Hết thời gian gia hạn mà chưa đóng đủ phí, tất cả Bảo Hiểm Bán Cùng mất hiệu lực kể từ ngày đến hạn đóng phí.\nLưu ý: T&C PRUKhỏe Linh Hoạt không quy định riêng thời gian gia hạn nên áp dụng T&C Chung (Điều 16 – Ưu tiên áp dụng).", "r": "T&C Chung BH Bán Cùng"}, "en": {"q": "A premium is due but the customer has not paid. What is the grace period for riders?", "o": ["30 days", "90 days", "60 days from the premium due date", "No grace period"], "e": "Article 8.2: If the premium is not paid in full when due, the Policyowner has a 60-day grace period from the due date. During the grace period, the Riders remain in force; if an Insured Event occurs and is approved, the benefit is paid after deducting overdue premium and any Indebtedness. If the premium is still unpaid at the end of the grace period, all Riders lapse from the premium due date.\nNote: The PRUKhỏe Linh Hoạt T&C does not set a separate grace period, so the General T&C applies (Article 16 – Order of precedence).", "r": "General Rider T&C"}}]}];</script>

let stack=[];

function sched(p,r){
  const s=p?{...p}:{r:0,i:0,e:2.5,due:0};
  if(r===1){s.r=0;s.i=0;s.e=Math.max(1.3,s.e-.2);s.due=Date.now()+60e3;}
  else if(r===2){s.i=s.r===0?1:Math.max(1,Math.round(s.i*1.2));s.e=Math.max(1.3,s.e-.15);s.r++;s.due=Date.now()+s.i*DAY;}
  else if(r===3){s.i=s.r===0?1:s.r===1?3:Math.round(Math.max(1,s.i)*s.e);s.r++;s.due=Date.now()+s.i*DAY;}
  else{s.i=s.r===0?3:s.r===1?6:Math.round(Math.max(1,s.i)*s.e*1.3);s.e+=.15;s.r++;s.due=Date.now()+s.i*DAY;}
  return s;
}

function deck(_,isBack){
  const P=S.p;
  setBar(modeName(),pname(P),{dots:[2,NS]});
  const unit=MODE==="quiz"?L("qs"):L("cards");
  const row=(g,i)=>{const list=poolOf(P,g),st=stat(list);const gv=g?gvars(g):pvars(P);const pct=Math.round(st.known/st.total*100);const n=g?P.groups.findIndex(x=>x[0]===g)+1:0;
    return `<button class="opt grp-opt" data-g="${g||""}" style="${gv};animation-delay:${i*.05}s"><span class="gside">${icon(g?GDEF[g].ic:"layers",30)}<i>${g?L("grp")+" "+n:L("allTag")}</i></span><span class="ot"><b>${g?GN(g):L("all")}</b><span>${st.total} ${unit} · ${st.nw} ${L("notLearned")} · ${pct}% ${L("known")}</span><div class="mbar"><i style="width:${pct}%"></i></div></span><span class="side-r">${st.due?`<span class="cnt-due">${st.due} ${L("due")}</span>`:""}<span class="chev">${SV.chev}</span></span></button>`;};

    <div class="center" style="margin-top:16px"><button class="linkbtn" id="rst">${L(P.all?"resetAll":"reset")}</button></div>`,isBack);
