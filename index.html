  const total=poolOf(S.p,S.g).length;
  setBar(modeName(),`${pname(S.p)} · ${S.g?GN(S.g):L("all")}`,{dots:[3,NS]});
  const opts=[[5,L("quick")],[10,L("mid")],[20,L("deep")],[total,L("whole")]].filter((o,i,a)=>o[0]<=total&&a.findIndex(x=>x[0]===o[0])===i);
  render(`<div class="q-head"><span class="eyebrow">${L("step2")}</span><h2>${L("h2")}</h2><p class="lead">${L("lead2")}</p></div>
  <div class="opts">${opts.map(([n,t],i)=>`<button class="opt time-opt" data-n="${n}" style="${S.g?gvars(S.g):pvars(S.p)};animation-delay:${i*.05}s"><span class="ot"><span class="big">${n}<small>${L("cards")}</small></span><span>${t}</span></span><span class="chev">${SV.chev}</span></button>`).join("")}</div>`,isBack);
  $$(".time-opt").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;b.classList.add("sel");setTimeout(()=>go(ready),150);});
}
/* ===== B4: sẵn sàng ===== */
function ready(_,isBack){
  const gv=S.g?gvars(S.g):pvars(S.p), Q=MODE==="quiz";
  setBar(modeName(),`${pname(S.p)} · ${S.n} ${L("cards")}`,{dots:[4,NS]});
  render(`<div class="ready" style="${gv}"><div class="rbadge">${icon(Q?"list":"cards",46)}</div>
    <span class="eyebrow" style="color:var(--g)">${L("step3")}</span><h2>${L("ready")}</h2>
    <div class="summary-pill"><span class="pill">${modeName()}</span><span class="pill">${esc(pname(S.p))}</span><span class="pill">${S.g?GN(S.g):L("all")}</span><span class="pill">${S.n} ${L("cards")}</span></div>
    <div class="how">
      <div><i>${icon(Q?"tapc":"brain",22)}</i><span><b>${L(Q?"hq1":"hf1")}</b>${L(Q?"hq1d":"hf1d")}</span></div>
      <div><i>${icon(Q?"bolt":"flipc",22)}</i><span><b>${L(Q?"hq2":"hf2")}</b>${L(Q?"hq2d":"hf2d")}</span></div>
      <div><i>${icon("star",22)}</i><span><b>${L("h3")}</b>${L("h3d")}</span></div>
    </div></div>`,isBack);
  dock(`<button class="btn b-pri full" id="go">${SV.play} ${L("start")}</button>`);
  $("#go").onclick=()=>{
    const now=Date.now(), pool=poolOf(S.p,S.g), c=MS();
    const due=shuffle(pool.filter(q=>c[q.uid]&&c[q.uid].due<=now));
    const nw=pool.filter(q=>!c[q.uid]);
    const rest=pool.filter(q=>c[q.uid]&&c[q.uid].due>now).sort((a,b)=>c[a.uid].due-c[b.uid].due);
    startSession(due.concat(nw,rest).slice(0,S.n).map(q=>q.uid),S.g?GN(S.g):L("all"));
  };
}
function startSession(ids,label){
  Object.assign(S,{q:ids.slice(),idx:0,done:0,total:ids.length,label,cnt:{1:0,2:0,3:0,4:0},right:0,answered:0,miss:[],pick:null,seen:{}});
  stack=[[home]]; go(card);
}
/* ===== Card renderers ===== */
function cardHead(q){
  return `<span class="deco1"></span><span class="deco2"></span><span class="grid"></span>
    <div class="fc-brand">${esc(q.p.name.toUpperCase())} · ${L("rev")}</div>
    <div class="fc-mid"><div><div class="fc-grp"><b>${L("grp")} ${q.gn}</b><span>${GN(q.gk)}</span></div><div class="lab">${L("question")}</div><div class="num">${pad(q.id)}</div></div><div class="fc-ic"><span>${icon(GDEF[q.gk].ic,30)}</span></div></div>`;
}
function quizFront(q){const t=T(q);
  return `<div class="fcard" style="${gvars(q.gk)}">${cardHead(q)}
    <div class="fc-quote"><p>${esc(t.q)}</p></div>
    <div class="answers" id="ansL">${t.o.map((o,i)=>`<button class="ans" data-i="${i}"><span class="L">${LET[i]}</span><span class="tx">${esc(o)}</span></button>`).join("")}</div>
    <div class="fc-foot"><span>PRUDENTIAL</span><span>${SV.tap} ${L("pick1")}</span></div></div>`;
}
function flashFront(q){const t=T(q);
  return `<div class="fcard flash" style="${gvars(q.gk)}">${cardHead(q)}
    <div class="ask-hint"><i>?</i>${L("thinkFirst")}</div>
    <div class="fc-quote" style="margin-top:12px"><p>${esc(t.q)}</p></div>
    <div class="fc-foot"><span>PRUDENTIAL</span><span>${SV.tap} ${L("tapFlip")}</span></div></div>`;
}
const topTags=q=>`<div class="bc-top"><span class="bc-tag">${L("qno")} ${pad(q.id)}</span><span class="pill">${L("grp")} ${q.gn} · ${GN(q.gk)}</span></div>`;
function expBlock(q){const t=T(q);
  return `<div class="exp"><h4><span>${L("exp")}</span>${t.r?`<em>${esc(t.r)}</em>`:""}</h4><p>${esc(t.e)}</p></div>
    ${q.v?`<div class="warn">${SV.alert}<span>${L("verify")}</span></div>`:""}
    <div class="bc-foot"><span>PRUDENTIAL</span><span>${esc(q.p.name.toUpperCase())}</span></div>`;
}
function quizResult(q,pick){
  const t=T(q), ok=pick===q.a;
  const res=ok?`<div class="res ok"><i>${SV.check}</i><div><b>${L("right")}</b><span>${L("rightS",LET[pick])}</span></div></div>`
    :`<div class="res no"><i>${SV.x}</i><div><b>${L("wrong",LET[q.a])}</b><span>${L("wrongS",LET[pick])}</span></div></div>`;
  return `<div class="bcard" style="${gvars(q.gk)}"><div class="bcard-in">${topTags(q)}
    ${res}<div class="bc-q">${esc(t.q)}</div>
    <div class="alist">${t.o.map((o,i)=>{const c=i===q.a?"right":i===pick?"wrong":"";return `<div class="al ${c}"><span class="L">${LET[i]}</span><span class="tx">${esc(o)}</span>${c==="right"?`<span class="mk" style="color:var(--ok)">${SV.check}</span>`:c==="wrong"?`<span class="mk" style="color:var(--no)">${SV.x}</span>`:""}</div>`;}).join("")}</div>
    ${expBlock(q)}</div></div>`;
}
function answerText(q){const t=T(q);
  return q.m?`<p>${L("allAbove")}</p><ul>${t.o.slice(0,3).map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:`<p>${esc(t.o[q.a])}</p>`;
}
function flashBack(q){const t=T(q);
  return `<div class="bcard" style="${gvars(q.gk)}"><div class="bcard-in">${topTags(q)}
    <div class="bc-q" style="margin-top:12px">${esc(t.q)}</div>
    <div class="ansbox"><h4>${SV.check}${L("answer")}</h4>${answerText(q)}</div>
    ${expBlock(q)}</div></div>`;
}
/* ===== Card screen ===== */
function card(_,isBack){
  if(S.idx>=S.q.length){stack.pop();return go(done);}
  const q=byU(S.q[S.idx]); S.pick=null;
  setBar(`${L("card")} ${S.done+1}/${S.total}`,`${pname(S.p)} · ${S.label}`,{onBack:()=>{if(confirm(L("endQ"))){stack.pop();S.done?go(done):reset(home);}},home:false});
  render(`<div class="prog"><i style="width:${S.done/S.total*100}%"></i></div>
    <div class="flipwrap"><div class="flipper" id="flp">${MODE==="quiz"?quizFront(q):flashFront(q)}</div></div>`,isBack);
  if(MODE==="quiz"){ $$(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.i)); }
  else { dock(`<button class="btn b-pri full" id="fB">${SV.flip} ${L("flip")}</button>`); $("#flp").onclick=flip; $("#fB").onclick=flip; }
}
function rateDock(q,sug){
  const p=MS()[q.uid];
  const d=dock(`<div class="dock-q">${L("rateQ")}</div><div class="rates">
    ${[1,2,3,4].map(r=>`<button class="rate r${r} ${sug===r?"sug":""}" data-r="${r}">${L("r"+r)}<small>${ivl(sched(p,r))}</small></button>`).join("")}</div>`);
  $$(".rate",d).forEach(b=>b.onclick=()=>rate(+b.dataset.r));
  const sub=bar.querySelector("small"); if(sub) sub.textContent=L("rateQ");
}
function answer(i){
  const f=$("#flp"); if(!f||f.dataset.done) return; f.dataset.done=1;
  const q=byU(S.q[S.idx]), ok=i===q.a; S.pick=i;
  if(!S.seen[q.uid]){S.answered++; if(ok) S.right++; S.seen[q.uid]=1;}
  if(!ok && !S.miss.includes(q.uid)) S.miss.push(q.uid);
  $$(".ans").forEach(b=>{b.disabled=true;b.classList.toggle("on",+b.dataset.i===i);}); $("#ansL").classList.add("has");
  buzz(ok?[15]:[30,60,30]);
  setTimeout(()=>{
    f.style.transition="opacity .2s,transform .2s"; f.style.opacity="0"; f.style.transform="scale(.98)";
    setTimeout(()=>{ f.innerHTML=quizResult(q,i); f.style.opacity="1"; f.style.transform="none";
      window.scrollTo({top:0,behavior:"smooth"}); rateDock(q,ok?3:1); },200);
  },220);
}
function flip(){
  const f=$("#flp"); if(!f||f.dataset.done) return; f.dataset.done=1;
  const q=byU(S.q[S.idx]);
  undock(); f.onclick=null;
  f.style.transform="rotateY(90deg)";
  setTimeout(()=>{
    f.style.transition="none"; f.style.transform="rotateY(-90deg)";
    f.innerHTML=flashBack(q); f.offsetWidth;
    f.style.transition=""; f.style.transform="none";
    window.scrollTo({top:0,behavior:"smooth"}); rateDock(q,0);
  },250);
}
function rate(r){
  const u=S.q[S.idx], q=byU(u), Q=MODE==="quiz";
  const s=sched(MS()[u],r); s.bad=Q?(S.pick!==q.a||r===1):(r===1); MS()[u]=s; saveSrs(); S.cnt[r]++;
  if(!Q && r<=2 && !S.miss.includes(u)) S.miss.push(u);
  if(r===1){S.q.splice(Math.min(S.q.length,S.idx+4),0,u);S.total++;}
  S.done++; S.idx++; buzz(12);
  stack.pop(); go(card);
}
function done(_,isBack){
  const Q=MODE==="quiz";
  setBar(L("doneT"),`${pname(S.p)} · ${S.label}`,{onBack:()=>reset(home),home:false});
  const t=S.cnt, C=263.9; let num,den,lvT,lvS;
  if(Q){num=S.right;den=S.answered;const pct=den?Math.round(num/den*100):0;const lv=pct>=90?L("lv1"):pct>=70?L("lv2"):pct>=50?L("lv3"):L("lv4");lvT=lv[0];lvS=`${L("pctRight",pct)} · ${lv[1]}`;}
  else{const u=new Set(S.q).size;num=Math.max(0,u-S.miss.length);den=u;const pct=den?num/den*100:0;lvT=(pct>=90?L("lv1"):pct>=70?L("lv2"):pct>=50?L("lv3"):L("lv4"))[0];lvS=`${L("flashRes",num,den)} · ${L("flashResS")}`;}
  render(`<div class="center"><div class="big-ok">${SV.check}</div><h2>${L("doneH",t[1]+t[2]+t[3]+t[4])}</h2><p class="lead">${L("doneL")}</p></div>
    <div class="scorecard"><div class="sring"><svg viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" id="sfg" cx="48" cy="48" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b>${num}/${den}</b></div>
      <div class="lv"><b>${lvT}</b><span>${lvS}</span></div></div>
    <div class="rates">${[1,2,3,4].map(r=>`<div class="rate r${r}">${t[r]}<small>${L("r"+r)}</small></div>`).join("")}</div>
    ${S.miss.length?`<div class="more" id="more"><button>${L(Q?"seeWrong":"seeHard",S.miss.length)} ${SV.down}</button><div class="mv">${S.miss.map(u=>{const q=byU(u),tt=T(q);return `<div class="wq"><small>${L("qno")} ${pad(q.id)} · ${GN(q.gk).toUpperCase()}</small>${esc(tt.q)}<span class="a">✓ ${q.m?esc(tt.o[3]):LET[q.a]+". "+esc(tt.o[q.a])}</span></div>`;}).join("")}</div></div>`:""}`,isBack);
  setTimeout(()=>{const f=$("#sfg");if(f)f.setAttribute("stroke-dashoffset",(C*(1-(den?num/den:0))).toFixed(1));},120);
  const m=$("#more"); if(m) m.querySelector("button").onclick=()=>m.classList.toggle("open");
  if(S.miss.length){const w=S.miss.slice();
    dock(`<button class="btn b-ghost" id="h">${L("home")}</button><button class="btn b-pri" id="a">${SV.flip} ${L(Q?"redoWrong":"redoHard")}</button>`,true);
    $("#a").onclick=()=>startSession(shuffle(w),L("reviewLabel"));
  } else {
    dock(`<button class="btn b-ghost" id="h">${L("home")}</button><button class="btn b-pri" id="a">${SV.flip} ${L("again")}</button>`,true);
    $("#a").onclick=()=>{stack=[[home],[modePick]];go(deck);};
  }
  $("#h").onclick=()=>reset(home);
}
document.addEventListener("keydown",e=>{
  const f=$("#flp"); if(!f) return;
  if(!f.dataset.done){
    const k=e.key.toUpperCase();
    if(MODE==="quiz"&&k.length===1&&"ABCD".includes(k)) answer("ABCD".indexOf(k));
    else if(MODE==="flash"&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();flip();}
  } else if(/^[1-4]$/.test(e.key)&&$(".rate[data-r]")) rate(+e.key);
});
reset(home);
})();
</script>
</body>
</html>
